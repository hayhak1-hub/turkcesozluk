kuhusu maswali ya mtandaoni, andika kwa <a href=\"mailto:hayhak1@gmail.com\">hayhak1@gmail.com</a>."]}, {"title": "11. Mabadiliko ya sera hii", "paragraphs": ["Sera hii inaweza kusasishwa mara kwa mara. Toleo la sasa linachapishwa kwenye ukurasa huu. Tarehe ya “Imesasishwa mwisho” inarekebishwa kwa mabadiliko muhimu."]}, {"title": "12. Mawasiliano", "paragraphs": ["Kwa sera ya faragha na uchakataji wa data: <a href=\"mailto:hayhak1@gmail.com\">hayhak1@gmail.com</a>"]}], "footer": "© 2026 Kamusi ya Kituruki · com.hayhak.turkcesozluk"}, "ta": {"title": "தனியுரிமைக் கொள்கை", "pageTitle": "தனியுரிமைக் கொள்கை — துருக்கிய அகராதி", "metaApp": "பயன்பாடு", "metaPackage": "தொகுப்பு பெயர்", "metaDeveloper": "டெவலப்பர்", "metaUpdated": "கடைசியாக புதுப்பிக்கப்பட்டது", "updatedDate": "ஆகத்து 7, 2026", "langLabel": "மொழி", "intro": "இந்த தனியுரிமைக் கொள்கை Google Play-ல் கிடைக்கும் <strong>துருக்கிய அகராதி</strong> பயன்பாடு பயனர் தரவை எவ்வாறு கையாளுகிறது என்பதை விளக்குகிறது. பயன்பாட்டைப் பதிவிறக்கம் செய்வதன் மூலமோ அல்லது பயன்படுத்துவதன் மூலமோ நீங்கள் இக்கொள்கையை ஏற்கிறீர்கள்.", "sections": [{"title": "1. தரவுக் கட்டுப்பாட்டாளர் மற்றும் தொடர்பு", "paragraphs": ["தரவுக் கட்டுப்பாட்டாளர் / டெவலப்பர்: ThunderCraft<br>மின்னஞ்சல்: <a href=\"mailto:hayhak1@gmail.com\">hayhak1@gmail.com</a>", "தனியுரிமை தொடர்பான கேள்விகளுக்கு மேலே உள்ள மின்னஞ்சல் முகவரி வழியாக எங்களை தொடர்பு கொள்ளுங்கள்."]}, {"title": "2. சேகரிக்கப்படும் தரவு", "paragraphs": ["பயன்பாட்டிற்கு கணக்கு உருவாக்கம், உள்நுழைவு அல்லது பதிவு தேவையில்லை. பெயர், மின்னஞ்சல், தொலைபேசி எண், த точного இடம் அல்லது அடையாள ஆவணங்கள் போன்ற தனிப்பட்ட அடையாளங்களை நாங்கள் வே knowingly சேகரிக்கவில்லை மற்றும் அவற்றை எங்கள் சேவையகங்களுக்கு அனுப்பவில்லை. பயன்பாட்டிற்கு சொந்த பயனர் கணக்கு அல்லது பின்தள சேவையகம் இல்லை."]}, {"title": "3. உங்கள் சாதனத்தில் உள்ளூரில் சேமிக்கப்படும் தரவு", "paragraphs": ["பின்வரும் தரவு உங்கள் சாதனத்தில் மட்டுமே (உள்ளூர் சேமிப்பு / தரவுத்தளம்) சேமிக்கப்படுகிறது மற்றும் சாதனத்திலிருந்து ஏற்றுமதி செய்யப்படவில்லை:", "நீங்கள் பயன்பாட்டை நிறுவல் நீக்கும்போது, இந்த உள்ளூர் தரவு உங்கள் சாதனத்திலிருந்து அகற்றப்படும்."], "items": ["பிடித்த சொற்கள்", "தேடல் வரலாறு", "பயனர் சேர்த்த சொற்கள் /同义语", "பயன்பாட்டில் புள்ளிவிவரங்கள் (எ.கா. வாராந்திர செயல்பாடு, தொடர்)", "தீம் மற்றும் அகராதி ம режим போன்ற அமைப்புகள்"]}, {"title": "4. இணைய வழியாக செயலாக்கப்படும் தரவு", "paragraphs": ["பயன்பாடு இணைய இணைப்பைப் பயன்படுத்தலாம். உள்ளூர் அகராதியில் சொல் கிடைக்காதபோது, வரையறை பெற தேடப்பட்ட <strong>சொல் உரை</strong> <a href=\"https://sozluk.gov.tr\" rel=\"noopener noreferrer\">sozluk.gov.tr</a> (துருக்கிய மொழி சங்கம் Güncel Türkçe Sözlük) க்கு அனுப்பப்படலாம்.", "உங்கள் சாதனத்தில் இணைய இணைப்பு இல்லை அல்லது TDK பதிலளிக்கவில்லை என்றால், ஆன்லைன் முடிவு காட்டப்படவில்லை; உள்ளூர் அகராதி அம்சங்கள் தொடர்ந்து செயல்படும்."], "items": ["அனுப்பப்பட்ட தரவு: தேடல் பெட்டியில் தட்டச்சு செய்யப்பட்ட சொல் மட்டும்", "நோக்கம்: அகராதி பொருள் / வரையறை காட்டுதல்", "தனிப்பட்ட அடையாள தகவல் அனுப்பப்படவில்லை", "இந்த கோரிக்கை TDK இன் பொது வலைத்தளத்திற்கு செய்யப்படுகிறது; பயன்பாடு TDK உடன் அ официальный கூட்டாண்மையில் இல்லை"]}, {"title": "5. அனுமதிகள்", "paragraphs": [], "items": ["<strong>இணைய (INTERNET):</strong> உள்ளூரில் கிடைக்காத சொற்களுக்கு TDK அகராதி வினவலுக்கு பயன்படுத்தப்படுகிறது.", "<strong>அறிவிப்புகள் (POST_NOTIFICATIONS):</strong> விருப்பத்தேர்வு. “நாளின் சொல்” அறிவிப்பைக் காட்ட கோரப்படுகிறது. சாதன அமைப்புகளில் முடக்கலாம்.", "<strong>குரல் தேடல் / மைக்ரofon:</strong> மைக்ரofon ஐகானைத் தட்டும்போது உங்கள் சாதனத்தின் பேச்சு அங்கீகார சேவை (எ.கா. Google) திறக்கப்படலாம். நாங்கள் ஆடியо பதிவுகளை சேமிக்கவில்லை; அங்கீகரிக்கப்பட்ட உரை மட்டும் தேடல் பெட்டியில் வைக்கப்படுகிறது."]}, {"title": "6. மூன்றாம் தரப்பினர்", "paragraphs": ["பயன்பாடு பின்வரும் மூன்றாம் தரப்பு சேவைகளுடன் interact செய்யலாம்:", "நாங்கள் விளம்பர SDK, analytics SDK அல்லது பயனர் கண்காணிப்பு கருவிகளைப் பயன்படுத்தவில்லை."], "items": ["<strong>Google Play / Play Store:</strong> பயன்பாட்டு விநியோகம் மற்றும் “எங்களை மதிப்பிடுங்கள்” மூலம் Play Store பக்கம் திறத்தல். இந்த செயல்முறை Google ஆல் நிர்வகிக்கப்படுகிறது.", "<strong>sozluk.gov.tr (TDK):</strong> உள்ளூரில் கிடைக்காத சொற்களுக்கான வரையறை தேடல். தேடப்பட்ட சொல் மட்டுமே அனுப்பப்படுகிறது.", "<strong>சாதன பேச்சு அங்கீகார சேவை:</strong> பயனர் குரல் தேடலைத் தொடங்கும்போது."]}, {"title": "7. தரவு பகிர்வு மற்றும் விற்பனை", "paragraphs": ["நாங்கள் பயனர் தரவை விற்கவில்லை. எங்கள் சேவையகங்களில் பயனர் சுயவிவரங்களை உருவாக்கவில்லை. பிரிவு 4 இல் விவரிக்கப்பட்டபடி, அகராதி வினவலுக்காக தேடப்பட்ட சொல் மட்டுமே TDK வலைத்தளத்திற்கு அனுப்பப்படலாம்."]}, {"title": "8. தரவு பாதுகாப்பு", "paragraphs": ["உள்ளூர் தரவு உங்கள் சாதனத்தில் இருக்கும். ஆன்லைன் அகராதி வினவல்கள் HTTPS வழியாக செய்யப்படுகின்றன. எந்த பாதுகாப்பு நடவடிக்கையும் முழுமையானது அல்ல; உங்கள் சாதனத்தை புதுப்பித்த நிலையில் வைத்திருக்க பரிந்துரைக்கிறோம்."]}, {"title": "9. குழந்தைகளின் தனியுரிமை", "paragraphs": ["பயன்பாடு ஒரு பொது மொழி கற்றல் / அகராதி பயன்பாடு. 13 வயதுக்கு கீழேயுள்ள குழந்தைகளிடமிருந்து knowingly தனிப்பட்ட தரவை சேகரிக்கவில்லை. பெற்றோர் தங்கள் குழந்தைகளின் பயன்பாட்டை மேற்பார்வை செய்ய வேண்டும்."]}, {"title": "10. உங்கள் உரிமைகள்", "paragraphs": ["பயன்பாட்டில் உள்ளூர் தரவை (எ.கா. பிடித்தவை அகற்றுதல்) அல்லது பயன்பாட்டை நிறுவல் நீக்குவதன் மூலம் நீக்கலாம். ஆன்லைன் வினவல்கள் தொடர்பான கேள்விகளுக்கு <a href=\"mailto:hayhak1@gmail.com\">hayhak1@gmail.com</a> க்கு எழுதுங்கள்."]}, {"title": "11. இக்கொள்கையில் மாற்றங்கள்", "paragraphs": ["இக்கொள்கை அவ்வப்போது புதுப்பிக்கப்படலாம். தற்போதைய பதிப்பு இந்தப் பக்கத்தில் வெளியிடப்படுகிறது. முக்கியமான மாற்றங்களுக்கு “கடைசியாக புதுப்பிக்கப்பட்டது” தேதி திருத்தப்படும்."]}, {"title": "12. தொடர்பு", "paragraphs": ["தனியுரிமைக் கொள்கை மற்றும் தரவு செயலாக்கத்திற்கு: <a href=\"mailto:hayhak1@gmail.com\">hayhak1@gmail.com</a>"]}], "footer": "© 2026 துருக்கிய அகராதி · com.hayhak.turkcesozluk"}, "te": {"title": "గోప్యతా విధానం", "pageTitle": "గోప్యతా విధానం — టర్కిష్ నిఘంటువు", "metaApp": "యాప్", "metaPackage": "ప్యాకేజీ పేరు", "metaDeveloper": "డెవలపర్", "metaUpdated": "చివరి నవీకరణ", "updatedDate": "ఆగస్టు 7, 2026", "langLabel": "భాష", "intro": "ఈ గోప్యతా విధానం Google Playలో అందుబాటులో ఉన్న <strong>టర్కిష్ నిఘంటువు</strong> యాప్ వినియోగదారు డేటాను ఎలా నిర్వహిస్తుందో వివరిస్తుంది. యాప్‌ను డౌన్‌లోడ్ చేయడం లేదా ఉపయోగించడం ద్వారా మీరు ఈ విధానానికి అంగీకరిస్తారు.", "sections": [{"title": "1. డేటా నియంత్రకుడు మరియు సంప్రదింపు", "paragraphs": ["డేటా నియంత్రకుడు / డెవలపర్: ThunderCraft<br>ఇమెయిల్: <a href=\"mailto:hayhak1@gmail.com\">hayhak1@gmail.com</a>", "గోప్యతకు సంబంధించిన ప్రశ్నల కోసం పై ఇమెయిల్ చిరునామా ద్వారా మమ్మల్ని సంప్రదించండి."]}, {"title": "2. సేకరించిన డేటా", "paragraphs": ["యాప్‌కు ఖాతా సృష్టి, సైన్-ఇన్ లేదా నమోదు అవసరం లేదు. మేము పేరు, ఇమెయిల్, ఫోన్ నంబర్, ఖచ్చితమైన స్థానం లేదా గుర్తింపు పత్రాలు వంటి వ్యక్తిగత గుర్తింపులను knowingly సేకరించము మరియు వాటిని మా సర్వర్‌లకు పంపము. యాప్‌కు స్వంత వినియోగదారు ఖాతా లేదా బ్యాకెండ్ సర్వర్ లేదు."]}, {"title": "3. మీ పరికరంలో స్థానికంగా నిల్వ చేసిన డేటా", "paragraphs": ["కింది డేటా మీ పరికరంలో మాత్రమే (స్థానిక నిల్వ / డేటాబేస్) నిల్వ చేయబడుతుంది మరియు పరికరం నుండి ఎగుమతి చేయబడదు:", "మీరు యాప్‌ను అన్‌ఇన్‌స్టాల్ చేసినప్పుడు ఈ స్థానిక డేటా మీ పరికరం నుండి తొలగించబడుతుంది."], "items": ["ఇష్టమైన పదాలు", "శోధన చరిత్ర", "వినియోగదారు జోడించిన పదాలు / పర్యాయపదాలు", "యాప్‌లో గణాంకాలు (ఉదా. వారపు కార్యకలాపం, స్ట్రీక్)", "థీమ్ మరియు నిఘంటువు మోడ్ వంటి సెట్టింగ్‌లు"]}, {"title": "4. ఇంటర్నెట్ ద్వారా ప్రాసెస్ చేసిన డేటా", "paragraphs": ["యాప్ ఇంటర్నెట్ కనెక్షన్‌ను ఉపయోగించవచ్చు. స్థానిక నిఘంటువులో పదం కనిపించనప్పుడు, నిర్వచనం పొందడానికి శోధించిన <strong>పద టెక్స్ట్</strong> <a href=\"https://sozluk.gov.tr\" rel=\"noopener noreferrer\">sozluk.gov.tr</a> (టర్కిష్ భాషా సంఘం Güncel Türkçe Sözlük) కు పంపబడవచ్చు.", "మీ పరికరానికి ఇంటర్నెట్ కనెక్షన్ లేకపోతే లేదా TDK స్పందించనప్పుడు, ఆన్‌లైన్ ఫలితం చూపించబడదు; స్థానిక నిఘంటువు ఫీచర్‌లు పని చేస్తూనే ఉంటాయి."], "items": ["పంపిన డేటా: శోధన పెట్టెలో టైప్ చేసిన పదం మాత్రమే", "ప్రయోజనం: నిఘంటువు అర్థం / నిర్వచనం చూపించడం", "వ్యక్తిగత గుర్తింపు సమాచారం పంపబడదు", "ఈ అభ్యర్థన TDK యొక్క పబ్లిక్ వెబ్‌సైట్‌కు చేయబడుతుంది; యాప్ TDKతో అధికారిక భాగస్వామ్యంలో లేదు"]}, {"title": "5. అనుమతులు", "paragraphs": [], "items": ["<strong>ఇంటర్నెట్ (INTERNET):</strong> స్థానికంగా కనిపించని పదాల కోసం TDK నిఘంటువు ప్రశ్నకు ఉపయోగించబడుతుంది.", "<strong>నోటిఫికేషన్‌లు (POST_NOTIFICATIONS):</strong> ఐచ్ఛికం. “రోజు పదం” నోటిఫికేషన్ చూపించడానికి అభ్యర్థించబడుతుంది. పరికర సెట్టింగ్‌లలో నిలిపివేయవచ్చు.", "<strong>వాయిస్ సెర్చ్ / మైక్రోఫోన్:</strong> మైక్రోఫోన్ ఐకాన్‌ను ట్యాప్ చేసినప్పుడు మీ పరికరం యొక్క స్పీచ్ రికగ్నిషన్ సేవ (ఉదా. Google) తెరవబడవచ్చు. మేము ఆడియో రికార్డింగ్‌లను నిల్వ చేయము; గుర్తించిన టెక్స్ట్ మాత్రమే శోధన పెట్టెలో ఉంచబడుతుంది."]}, {"title": "6. తృతీయ పక్షాలు", "paragraphs": ["యాప్ కింది తృతీయ-పక్ష సేవలతో interact చేయవచ్చు:", "మేము ప్రకటన SDK, analytics SDK లేదా వినియోగదారు ట్రాకింగ్ సాధనాలను ఉపయోగించము."], "items": ["<strong>Google Play / Play Store:</strong> యాప్ పంపిణీ మరియు “మమ్మల్ని రేట్ చేయండి” ద్వారా Play Store పేజీ తెరవడం. ఈ ప్రక్రియ Google ద్వారా నిర్వహించబడుతుంది.", "<strong>sozluk.gov.tr (TDK):</strong> స్థానికంగా కనిపించని పదాల నిర్వచన శోధన. శోధించిన పదం మాత్రమే పంపబడుతుంది.", "<strong>పరికర స్పీచ్ రికగ్నిషన్ సేవ:</strong> వినియోగదారు వాయిస్ సెర్చ్ ప్రారంభించినప్పుడు."]}, {"title": "7. డేటా షేరింగ్ మరియు అమ్మకం", "paragraphs": ["మేము వినియోగదారు డేటాను అమ్మము. మా సర్వర్‌లలో వినియోగదారు ప్రొఫైల్‌లను సృష్టించము. 4వ విభాగంలో వివరించినట్లుగా, నిఘంటువు ప్రశ్న కోసం శోధించిన పదం మాత్రమే TDK వెబ్‌సైట్‌కు పంపబడవచ్చు."]}, {"title": "8. డేటా భద్రత", "paragraphs": ["స్థానిక డేటా మీ పరికరంలో ఉంటుంది. ఆన్‌లైన్ నిఘంటువు ప్రశ్నలు HTTPS ద్వారా చేయబడతాయి. ఏ భద్రతా చర్య పూర్తిగా ఉండదు; మీ పరికరాన్ని అప్‌డేట్‌గా ఉంచమని సిఫారసు చేస్తాము."]}, {"title": "9. పిల్లల గోప్యత", "paragraphs": ["యాప్ సాధారణ భాషా అభ్యాస / నిఘంటువు యాప్. 13 సంవత్సరాల కంటే తక్కువ వయస్సు పిల్లల నుండి knowingly వ్యక్తిగత డేటాను సేకరించము. తల్లిదండ్రులు పిల్లల యాప్ వినియోగాన్ని పర్యవేక్షించాలి."]}, {"title": "10. మీ హక్కులు", "paragraphs": ["యాప్‌లో స్థానిక డేటాను (ఉదా. ఇష్టాలను తొలగించడం) లేదా యాప్‌ను అన్‌ఇన్‌స్టాల్ చేయడం ద్వారా తొలగించవచ్చు. ఆన్‌లైన్ ప్రశ్నలకు సంబంధించి <a href=\"mailto:hayhak1@gmail.com\">hayhak1@gmail.com</a> కు వ్రాయండి."]}, {"title": "11. ఈ విధానంలో మార్పులు", "paragraphs": ["ఈ విధానం కాలక్రమేణా నవీకరించబడవచ్చు. ప్రస్తుత వersion ఈ పేజీలో ప్రచురించబడుతుంది. ముఖ్యమైన మార్పులకు “చివరి నవీకరణ” తేదీ సవరించబడుతుంది."]}, {"title": "12. సంప్రదింపు", "paragraphs": ["గోప్యతా విధానం మరియు డేటా ప్రాసెసింగ్ కోసం: <a href=\"mailto:hayhak1@gmail.com\">hayhak1@gmail.com</a>"]}], "footer": "© 2026 టర్కిష్ నిఘంటువు · com.hayhak.turkcesozluk"}, "tk": {"title": "Gizlinlik syýasaty", "pageTitle": "Gizlinlik syýasaty — Türkçe sözlük", "metaApp": "Programma", "metaPackage": "paket ady", "metaDeveloper": "Öndüriji", "metaUpdated": "Soňky täzelenme", "updatedDate": "2026-nji ýylyň 7-nji awgusty", "langLabel": "Dil", "intro": "Bu gizlinlik syýasaty Google Play arkaly hödürlenýän <strong>Türkçe sözlük</strong> programmasynyň ulanyjy maglumatlaryny nädip işleýändigini düşündirýär. Programmany göçürip almak ýa-da ulanmak bilen siz bu syýasata razylaşýarsyňyz.", "sections": [{"title": "1. Maglumat dolandyryjy we aragatnaşyk", "paragraphs": ["Maglumat dolandyryjy / Öndüriji: ThunderCraft<br>Elektron poçta: <a href=\"mailto:hayhak1@gmail.com\">hayhak1@gmail.com</a>", "Gizlinlik bilen baglanyşykly soraglar üçin ýokardaky elektron poçta arkaly biz bilen habarlaşyň."]}, {"title": "2. Ýygnan maglumatlar", "paragraphs": ["Programma hasap döretmek, girmek ýa-da hasaba almak talap etmeýär. Biz at, elektron poçta, telefon belgisi, takyk ýerleşiş ýa-da şahsyýetnama ýaly şahsy identifikasiýa maglumatlaryny bilkastlaýyn ýygnamaýarys we olary öz serwerlerimize ibermeýäris. Programmanyň öz ulanyjy hasaby ýa-da backend serweri ýok."]}, {"title": "3. Enjamda ýerli saklanýan maglumatlar", "paragraphs": ["Aşakdaky maglumatlar diňe enjamyňyzda (ýerli saklamak / maglumatlar bazasy) saklanýar we enjamdan daşary geçirilmeýär:", "Programmany aýyranyňyzda bu ýerli maglumatlar hem enjamdan aýrylýar."], "items": ["Halanan sözler", "Gözleg taryhy", "Ulanyjy goşan sözler / sinonimler", "Programma içindäki statistika (mes. hepdelik işjeňlik, yzygider)", "Tema we sözlük režimi ýaly sazlamalar"]}, {"title": "4. Internet arkaly işlenýän maglumatlar", "paragraphs": ["Programma internet baglanyşygyny ulanyp bilýär. Ýerli sözlükde söz tapylmasa, many almak üçin gözlenen <strong>söz teksti</strong> <a href=\"https://sozluk.gov.tr\" rel=\"noopener noreferrer\">sozluk.gov.tr</a> (Turkish Language Association Current Turkish Dictionary) salgysyna iberilip bilner.", "Enjamda internet baglanyşygy bolmasa ýa-da TDK jogap bermese, onlaýn netije görkezilmeýär; ýerli sözlük funksiýalary işlemegini dowam etdirýär."], "items": ["Iberilýän maglumat: diňe gözleg meýdançasynda ýazylan söz", "Maksat: sözlük manyny / kesgitlemesini görkezmek", "Şahsy identifikasiýa maglumatlary iberilmeýär", "Bu sorag TDK-nyň açyk sahypasyna iberilýär; programma TDK bilen resmi hyzmatdaşlykda däl"]}, {"title": "5. Rugsatlar", "paragraphs": [], "items": ["<strong>Internet (INTERNET):</strong> Ýerli tapylmadyk sözler üçin TDK sözlük soragyny ýerine ýetirmek üçin ulanylýar.", "<strong>Bildirişler (POST_NOTIFICATIONS):</strong> Islege bagly. “Günüň sözi” bildirişini görkezmek üçin sorag edilýär. Enjam sazlamalaryndan öçürilip bilner.", "<strong>Sesli gözleg / mikrofon:</strong> Mikrofon nyşanyna basylanda enjamyňyzyň ses tanamak hyzmaty (mes. Google) açylyp bilner. Biz audio ýazgylary saklamaýarys; diňe tanalan tekst gözleg meýdançasyna ýazylýar."]}, {"title": "6. Üçünji taraplar", "paragraphs": ["Programma aşakdaky üçünji tarap hyzmatlary bilen özara täsir edip bilýär:", "Biz reklama SDK, analitika SDK ýa-da ulanyjy yzarlamak gurallaryny ulanmaýarys."], "items": ["<strong>Google Play / Play Store:</strong> Programmanyň paýlanmagy we “Bize baha beriň” arkaly Play Store sahypasyny açmak üçin. Bu proses Google tarapyndan dolandyrylýar.", "<strong>sozluk.gov.tr (TDK):</strong> Ýerli tapylmadyk sözler üçin many soragy. Diňe gözlenen söz iberilýär.", "<strong>Enjam ses tanamak hyzmaty:</strong> Ulanyjy sesli gözlegi başlanda."]}, {"title": "7. Maglumatlary paýlaşmak we satmak", "paragraphs": ["Biz ulanyjy maglumatlaryny satmaýarys. Öz serwerlerimizde ulanyjy profilini döretmeýäris. 4-nji bölümde düşündirilýän ýaly, diňe sözlük soragy üçin gözlenen söz TDK sahypasyna iberilip bilner."]}, {"title": "8. Maglumat howpsuzlygy", "paragraphs": ["Ýerli maglumatlar enjamyňyzda saklanýar. Onlaýn sözlük soraglary HTTPS arkaly ýerine ýetirilýär. Hiç hili howpsuzlyk çäresi doly däl; enjamyňyzy täzelemegi maslahat berýäris."]}, {"title": "9. Çagalaryň gizlinligi", "paragraphs": ["Programma umumy dil öwrenmek / sözlük programmasydyr. 13 ýaşdan kiçi çagalardan bilkastlaýyn şahsy maglumat ýygnamaýarys. Ene-atalar çagalarynyň programmany ulanmagyny gözetmeli."]}, {"title": "10. Siziň hukuklaryňyz", "paragraphs": ["Ýerli maglumatlary programma içinde (mes. halananlary aýyrmak) ýa-da programmany aýyrmak bilen pozup bilersiňiz. Onlaýn soraglar barada <a href=\"mailto:hayhak1@gmail.com\">hayhak1@gmail.com</a> salgysyna ýazyň."]}, {"title": "11. Syýasatdagy üýtgeşmeler", "paragraphs": ["Bu syýasat wagty-wagty täzelenip bilner. Häzirki wersiýa bu sahypada çap edilýär. Möhüm üýtgeşmelerde “Soňky täzelenme” senesi täzelenýär."]}, {"title": "12. Aragatnaşyk", "paragraphs": ["Gizlinlik syýasaty we maglumatlary işlemek barada: <a href=\"mailto:hayhak1@gmail.com\">hayhak1@gmail.com</a>"]}], "footer": "© 2026 Türkçe sözlük · com.hayhak.turkcesozluk"}, "tr": {"title": "Gizlilik Politikası", "pageTitle": "Gizlilik Politikası — Türkçe Sözlük", "metaApp": "Uygulama", "metaPackage": "paket adı", "metaDeveloper": "Geliştirici", "metaUpdated": "Son güncelleme", "updatedDate": "7 Ağustos 2026", "langLabel": "Dil", "intro": "Bu gizlilik politikası, Google Play üzerinden sunulan <strong>Türkçe Sözlük</strong> uygulamasının kullanıcı verilerini nasıl işlediğini açıklar. Uygulamayı indirerek veya kullanarak bu politikayı kabul etmiş sayılırsınız.", "sections": [{"title": "1. Veri Sorumlusu ve İletişim", "paragraphs": ["Veri sorumlusu / Geliştirici: ThunderCraft<br>E-posta: <a href=\"mailto:hayhak1@gmail.com\">hayhak1@gmail.com</a>", "Gizlilik ile ilgili sorularınız için yukarıdaki e-posta adresinden bize ulaşabilirsiniz."]}, {"title": "2. Toplanan Veriler", "paragraphs": ["Uygulama hesap oluşturma, giriş veya kayıt istemez. Ad, soyad, e-posta, telefon numarası, kesin konum veya kimlik belgesi gibi kişisel kimlik bilgilerini bilerek toplamayız ve kendi sunucularımıza göndermeyiz. Uygulamanın kendisine ait bir kullanıcı hesabı / backend sunucusu yoktur."]}, {"title": "3. Cihazda Yerel Olarak Saklanan Veriler", "paragraphs": ["Aşağıdaki veriler yalnızca cihazınızda (yerel depolama / veritabanı) tutulur ve cihazınızdan dışarı aktarılmaz:", "Uygulamayı kaldırdığınızda bu yerel veriler de cihazınızdan silinir."], "items": ["Favori kelimeler", "Arama geçmişi", "Kullanıcının eklediği kelimeler / eş anlamlılar", "Uygulama içi istatistikler (ör. haftalık aktivite, seri)", "Tema ve sözlük modu gibi ayarlar"]}, {"title": "4. İnternet Üzerinden İşlenen Veriler", "paragraphs": ["Uygulama internet bağlantısı kullanabilir. Yerel sözlükte bulunamayan bir kelime arandığında, anlam bilgisi almak için aranan <strong>kelime metni</strong> <a href=\"https://sozluk.gov.tr\" rel=\"noopener noreferrer\">sozluk.gov.tr</a> (Türk Dil Kurumu Güncel Türkçe Sözlük) adresine gönderilebilir.", "Cihazınızın internet bağlantısı yoksa veya TDK yanıt vermezse ilgili online sonuç gösterilmez; yerel sözlük özellikleri çalışmaya devam eder."], "items": ["Gönderilen veri: yalnızca arama kutusuna yazılan kelime", "Amaç: sözlük anlamı / tanım bilgisini göstermek", "Kişisel kimlik bilgisi gönderilmez", "Bu istek TDK’nın kamuya açık sitesine yapılır; uygulama TDK ile resmî bir ortaklık içinde değildir"]}, {"title": "5. İzinler", "paragraphs": [], "items": ["<strong>İnternet (INTERNET):</strong> Yerelde bulunamayan kelimeler için TDK sözlük sorgusu yapmak amacıyla kullanılır.", "<strong>Bildirimler (POST_NOTIFICATIONS):</strong> İsteğe bağlıdır. “Günün kelimesi” bildirimi gösterebilmek için istenir. Cihaz ayarlarından kapatılabilir.", "<strong>Sesli arama / mikrofon:</strong> Mikrofon simgesine dokunduğunuzda cihazınızın kendi ses tanıma servisi (ör. Google) açılabilir. Ses kaydı uygulamamız tarafından saklanmaz; yalnızca tanınan metin arama kutusuna yazılır."]}, {"title": "6. Üçüncü Taraflar", "paragraphs": ["Uygulama aşağıdaki üçüncü taraf hizmetlerle etkileşebilir:", "Reklam SDK’sı, analitik SDK’sı veya kullanıcı takip araçları kullanmıyoruz."], "items": ["<strong>Google Play / Play Store:</strong> Uygulama dağıtımı ve “Bizi Değerlendirin” ile Play Store sayfasının açılması için. Bu süreç Google tarafından yönetilir.", "<strong>sozluk.gov.tr (TDK):</strong> Yerelde bulunamayan kelimeler için anlam sorgusu. Yalnızca aranan kelime iletilir.", "<strong>Cihaz ses tanıma servisi:</strong> Kullanıcı sesli aramayı başlattığında."]}, {"title": "7. Verilerin Paylaşımı ve Satışı", "paragraphs": ["Kullanıcı verilerini satmayız. Kendi sunucularımızda kullanıcı profili oluşturmayız. Bölüm 4’te açıklandığı gibi, yalnızca sözlük sorgusu için aranan kelime TDK sitesine iletilebilir."]}, {"title": "8. Veri Güvenliği", "paragraphs": ["Yerel veriler cihazınızda tutulur. Online sözlük sorguları HTTPS üzerinden yapılır. Hiçbir güvenlik önlemi mutlak değildir; cihazınızı güncel tutmanızı öneririz."]}, {"title": "9. Çocukların Gizliliği", "paragraphs": ["Uygulama genel bir dil öğrenme / sözlük uygulamasıdır. 13 yaşın altındaki çocuklardan bilerek kişisel veri toplamayız. Ebeveynler çocuklarının uygulamayı kullanımını denetlemelidir."]}, {"title": "10. Haklarınız", "paragraphs": ["Yerel verileri uygulama içinden (ör. favorileri kaldırarak) veya uygulamayı kaldırarak silebilirsiniz. Online sorgulara ilişkin sorularınız için <a href=\"mailto:hayhak1@gmail.com\">hayhak1@gmail.com</a> adresine yazabilirsiniz."]}, {"title": "11. Politikadaki Değişiklikler", "paragraphs": ["Bu politika zaman zaman güncellenebilir. Güncel sürüm bu sayfada yayınlanır. Önemli değişikliklerde “Son güncelleme” tarihi yenilenir."]}, {"title": "12. İletişim", "paragraphs": ["Gizlilik politikası ve veri işleme hakkında: <a href=\"mailto:hayhak1@gmail.com\">hayhak1@gmail.com</a>"]}], "footer": "© 2026 Türkçe Sözlük · com.hayhak.turkcesozluk"}, "ur": {"title": "رازداری کی پالیسی", "pageTitle": "رازداری کی پالیسی — ترکی لغت", "metaApp": "ایپ", "metaPackage": "پیکج کا نام", "metaDeveloper": "ڈویلپر", "metaUpdated": "آخری اپ ڈیٹ", "updatedDate": "7 اگست 2026", "langLabel": "زبان", "intro": "یہ رازداری کی پالیسی وضاحت کرتی ہے کہ Google Play پر دستیاب <strong>ترکی لغت</strong> ایپ صارف کے ڈیٹا کو کیسے ہینڈل کرتی ہے۔ ایپ ڈاؤن لوڈ یا استعمال کر کے آپ اس پالیسی سے اتفاق کرتے ہیں۔", "sections": [{"title": "1. ڈیٹا کنٹرولر اور رابطہ", "paragraphs": ["ڈیٹا کنٹرولر / ڈویلپر: ThunderCraft<br>ای میل: <a href=\"mailto:hayhak1@gmail.com\">hayhak1@gmail.com</a>", "رازداری سے متعلق سوالات کے لیے اوپر دیے گئے ای میل پتے پر ہم سے رابطہ کریں۔"]}, {"title": "2. جمع شدہ ڈیٹا", "paragraphs": ["ایپ کو اکاؤنٹ بنانے، سائن ان یا رجسٹریشن کی ضرورت نہیں۔ ہم جان بوجھ کر نام، ای میل، فون نمبر، درست مقام یا شناختی دستاویزات جیسے ذاتی شناخت کنندگان جمع نہیں کرتے اور انہیں اپنے سرورز پر نہیں بھیجتے۔ ایپ کا اپنا صارف اکاؤنٹ یا بیک اینڈ سرور نہیں ہے۔"]}, {"title": "3. آپ کے آلے پر مقامی طور پر محفوظ ڈیٹا", "paragraphs": ["مندرجہ ذیل ڈیٹا صرف آپ کے آلے پر (مقامی اسٹوریج / ڈیٹا بیس) محفوظ ہوتا ہے اور آلے سے برآمد نہیں ہوتا:", "جب آپ ایپ ان انسٹال کرتے ہیں تو یہ مقامی ڈیٹا آپ کے آلے سے ہٹا دیا جاتا ہے۔"], "items": ["پسندیدہ الفاظ", "تلاش کی تاریخ", "صارف کے شامل کردہ الفاظ / مترادفات", "ایپ میں اعداد و شمار (جیسے ہفتہ وار سرگرمی، سلسلہ)", "تھیم اور لغت موڈ جیسی ترتیبات"]}, {"title": "4. انٹرنیٹ کے ذریعے پروسیس شدہ ڈیٹا", "paragraphs": ["ایپ انٹرنیٹ کنکشن استعمال کر سکتی ہے۔ جب مقامی لغت میں لفظ نہ ملے تو تعریف حاصل کرنے کے لیے تلاش کیا گیا <strong>لفظ کا متن</strong> <a href=\"https://sozluk.gov.tr\" rel=\"noopener noreferrer\">sozluk.gov.tr</a> (ترکی زبان کی انجمن Güncel Türkçe Sözlük) پر بھیجا جا سکتا ہے۔", "اگر آپ کے آلے میں انٹرنیٹ کنکشن نہیں یا TDK جواب نہ دے تو آن لائن نتیجہ نہیں دکھایا جاتا؛ مقامی لغت کی خصوصیات کام جاری رکھتی ہیں۔"], "items": ["بھیجا گیا ڈیٹا: صرف تلاش خانے میں لکھا گیا لفظ", "مقصد: لغت کا مطلب / تعریف دکھانا", "کوئی ذاتی شناختی معلومات نہیں بھیجی جاتی", "یہ درخواست TDK کی عوامی ویب سائٹ پر کی جاتی ہے؛ ایپ TDK کے ساتھ سرکاری شراکت داری میں نہیں"]}, {"title": "5. اجازتیں", "paragraphs": [], "items": ["<strong>انٹرنیٹ (INTERNET):</strong> مقامی طور پر نہ ملنے والے الفاظ کے لیے TDK لغت کی درخواست کے لیے استعمال ہوتا ہے۔", "<strong>اطلاعات (POST_NOTIFICATIONS):</strong> اختیاری۔ “دن کا لفظ” اطلاع دکھانے کے لیے درخواست کی جاتی ہے۔ آلہ کی ترتیبات میں بند کیا جا سکتا ہے۔", "<strong>وائس سرچ / مائیکروفون:</strong> مائیکروفون آئیکن پر ٹیپ کرنے پر آپ کے آلے کی تقریر شناسی سروس (جیسے Google) کھل سکتی ہے۔ ہم آڈیو ریکارڈنگ محفوظ نہیں کرتے؛ صرف پہچANA گیا متن تلاش خانے میں رکھا جاتا ہے۔"]}, {"title": "6. تیسرے فریق", "paragraphs": ["ایپ مندرجہ ذیل تیسرے فریق کی خدمات کے ساتھ interact کر سکتی ہے:", "ہم اشتہاری SDK، تجزیاتی SDK یا صارف ٹریکنگ ٹولز استعمال نہیں کرتے۔"], "items": ["<strong>Google Play / Play Store:</strong> ایپ کی تقسیم اور “ہمیں درجہ دیں” کے ذریعے Play Store صفحہ کھولنا۔ یہ عمل Google کے زیر انتظام ہے۔", "<strong>sozluk.gov.tr (TDK):</strong> مقامی طور پر نہ ملنے والے الفاظ کی تعریف کی تلاش۔ صرف تلاش کیا گیا لفظ بھیجا جاتا ہے۔", "<strong>آلے کی تقریر شناسی سروس:</strong> جب صارف وائس سرچ شروع کرتا ہے۔"]}, {"title": "7. ڈیٹا کا اشتراک اور فروخت", "paragraphs": ["ہم صارف کا ڈیٹا نہیں بیچتے۔ ہم اپنے سرورز پر صارف پروفائل نہیں بناتے۔ جیسا کہ سیکشن 4 میں بیان ہے، صرف لغت کی درخواست کے لیے تلاش کیا گیا لفظ TDK ویب سائٹ پر بھیجا جا سکتا ہے۔"]}, {"title": "8. ڈیٹا کی سیکیورٹی", "paragraphs": ["مقامی ڈیٹا آپ کے آلے پر رہتا ہے۔ آن لائن لغت کی درخواستیں HTTPS کے ذریعے کی جاتی ہیں۔ کوئی سیکیورٹی اقدام مکمل نہیں؛ اپنے آلے کو اپ ڈیٹ رکھنے کی سفارش کرتے ہیں۔"]}, {"title": "9. بچوں کی رازداری", "paragraphs": ["ایپ ایک عمومی زبان سیکھنے / لغت ایپ ہے۔ ہم جان بوجھ کر 13 سال سے کم عمر بچوں سے ذاتی ڈیٹا جمع نہیں کرتے۔ والدین کو بچوں کے ایپ استعمال کی نگرانی کرنی چاہیے۔"]}, {"title": "10. آپ کے حقوق", "paragraphs": ["آپ ایپ میں مقامی ڈیٹا (جیسے پسندیدہ ہٹا کر) یا ایپ ان انسٹال کر کے حذف کر سکتے ہیں۔ آن لائن درخواستوں کے بارے میں سوالات کے لیے <a href=\"mailto:hayhak1@gmail.com\">hayhak1@gmail.com</a> پر لکھیں۔"]}, {"title": "11. اس پالیسی میں تبدیلیاں", "paragraphs": ["یہ پالیسی وقتاً فوقتاً اپ ڈیٹ ہو سکتی ہے۔ موجودہ ورژن اس صفحے پر شائع ہوتا ہے۔ اہم تبدیلیوں پر “آخری اپ ڈیٹ” کی تاریخ نظر ثانی ہوتی ہے۔"]}, {"title": "12. رابطہ", "paragraphs": ["رازداری کی پالیسی اور ڈیٹا پروسیسنگ کے لیے: <a href=\"mailto:hayhak1@gmail.com\">hayhak1@gmail.com</a>"]}], "footer": "© 2026 ترکی لغت · com.hayhak.turkcesozluk"}, "uz": {"title": "Maxfiylik siyosati", "pageTitle": "Maxfiylik siyosati — Turk lug'ati", "metaApp": "Ilova", "metaPackage": "paket nomi", "metaDeveloper": "Ishlab chiquvchi", "metaUpdated": "Oxirgi yangilanish", "updatedDate": "2026-yil 7-avgust", "langLabel": "Til", "intro": "Bu maxfiylik siyosati Google Play orqali taqdim etilgan <strong>Turk lug'ati</strong> ilovasi foydalanuvchi ma'lumotlarini qanday qayta ishlashini tushuntiradi. Ilovani yuklab olish yoki foydalanish orqali siz ushbu siyosatga rozilik bildirasiz.", "sections": [{"title": "1. Ma'lumotlar nazoratchisi va aloqa", "paragraphs": ["Ma'lumotlar nazoratchisi / Ishlab chiquvchi: ThunderCraft<br>Elektron pochta: <a href=\"mailto:hayhak1@gmail.com\">hayhak1@gmail.com</a>", "Maxfiylik bo'yicha savollar uchun yuqoridagi elektron pochta orqali biz bilan bog'laning."]}, {"title": "2. Yig'iladigan ma'lumotlar", "paragraphs": ["Ilova hisob yaratish, kirish yoki ro'yxatdan o'tishni talab qilmaydi. Biz ism, elektron pochta, telefon raqami, aniq joylashuv yoki shaxsni tasdiqlovchi hujjatlar kabi shaxsiy identifikatsiya ma'lumotlarini ataylab yig'maymiz va ularni o'z serverlarimizga yubormaymiz. Ilovaning o'z foydalanuvchi hisobi yoki backend serveri yo'q."]}, {"title": "3. Qurilmada mahalliy saqlanadigan ma'lumotlar", "paragraphs": ["Quyidagi ma'lumotlar faqat qurilmangizda (mahalliy xotira / ma'lumotlar bazasi) saqlanadi va qurilmadan tashqariga uzatilmaydi:", "Ilovani o'chirib tashlaganingizda bu mahalliy ma'lumotlar ham qurilmadan o'chiriladi."], "items": ["Sevimli so'zlar", "Qidiruv tarixi", "Foydalanuvchi qo'shgan so'zlar / sinonimlar", "Ilova ichidagi statistika (mas. haftalik faollik, seriya)", "Mavzu va lug'at rejimi kabi sozlamalar"]}, {"title": "4. Internet orqali qayta ishlanadigan ma'lumotlar", "paragraphs": ["Ilova internet aloqasidan foydalanishi mumkin. Mahalliy lug'atda so'z topilmasa, ma'no olish uchun qidirilgan <strong>so'z matni</strong> <a href=\"https://sozluk.gov.tr\" rel=\"noopener noreferrer\">sozluk.gov.tr</a> (Turkish Language Association Current Turkish Dictionary) manziliga yuborilishi mumkin.", "Qurilmada internet aloqasi bo'lmasa yoki TDK javob bermasa, onlayn natija ko'rsatilmaydi; mahalliy lug'at funksiyalari ishlashda davom etadi."], "items": ["Yuboriladigan ma'lumot: faqat qidiruv maydoniga yozilgan so'z", "Maqsad: lug'at ma'nosi / ta'rif ma'lumotini ko'rsatish", "Shaxsiy identifikatsiya ma'lumotlari yuborilmaydi", "Bu so'rov TDKning ochiq veb-saytiga yuboriladi; ilova TDK bilan rasmiy hamkorlikda emas"]}, {"title": "5. Ruxsatlar", "paragraphs": [], "items": ["<strong>Internet (INTERNET):</strong> Mahalliy topilmagan so'zlar uchun TDK lug'at so'rovini amalga oshirish uchun ishlatiladi.", "<strong>Bildirishnomalar (POST_NOTIFICATIONS):</strong> Ixtiyoriy. “Kun so'zi” bildirishnomasini ko'rsatish uchun so'raladi. Qurilma sozlamalaridan o'chirilishi mumkin.", "<strong>Ovozli qidiruv / mikrofon:</strong> Mikrofon belgisini bosganingizda qurilmangizning ovozni tanish xizmati (mas. Google) ochilishi mumkin. Biz audio yozuvlarni saqlamaymiz; faqat tanilgan matn qidiruv maydoniga yoziladi."]}, {"title": "6. Uchinchi tomonlar", "paragraphs": ["Ilova quyidagi uchinchi tomon xizmatlari bilan o'zaro aloqada bo'lishi mumkin:", "Biz reklama SDK, analitika SDK yoki foydalanuvchini kuzatish vositalaridan foydalanmaymiz."], "items": ["<strong>Google Play / Play Store:</strong> Ilovani tarqatish va “Bizni baholang” orqali Play Store sahifasini ochish uchun. Bu jarayon Google tomonidan boshqariladi.", "<strong>sozluk.gov.tr (TDK):</strong> Mahalliy topilmagan so'zlar uchun ma'no so'rovi. Faqat qidirilgan so'z uzatiladi.", "<strong>Qurilma ovozni tanish xizmati:</strong> Foydalanuvchi ovozli qidiruvni boshlaganda."]}, {"title": "7. Ma'lumotlarni ulashish va sotish", "paragraphs": ["Biz foydalanuvchi ma'lumotlarini sotmaymiz. O'z serverlarimizda foydalanuvchi profili yaratmaymiz. 4-bo'limda tushuntirilganidek, faqat lug'at so'rovi uchun qidirilgan so'z TDK saytiga uzatilishi mumkin."]}, {"title": "8. Ma'lumotlar xavfsizligi", "paragraphs": ["Mahalliy ma'lumotlar qurilmangizda saqlanadi. Onlayn lug'at so'rovlari HTTPS orqali amalga oshiriladi. Hech qanday xavfsizlik chorasi mutlaq emas; qurilmangizni yangilab turishingizni tavsiya qilamiz."]}, {"title": "9. Bolalar maxfiyligi", "paragraphs": ["Ilova umumiy til o'rganish / lug'at ilovasidir. 13 yoshdan kichik bolalardan ataylab shaxsiy ma'lumot yig'maymiz. Ota-onalar bolalarining ilovadan foydalanishini nazorat qilishi kerak."]}, {"title": "10. Sizning huquqlaringiz", "paragraphs": ["Mahalliy ma'lumotlarni ilova ichida (mas. sevimlilarni o'chirish) yoki ilovani o'chirib tashlash orqali o'chirishingiz mumkin. Onlayn so'rovlar bo'yicha savollar uchun <a href=\"mailto:hayhak1@gmail.com\">hayhak1@gmail.com</a> manziliga yozing."]}, {"title": "11. Siyosatdagi o'zgarishlar", "paragraphs": ["Bu siyosat vaqti-vaqti bilan yangilanishi mumkin. Joriy versiya ushbu sahifada e'lon qilinadi. Muhim o'zgarishlarda “Oxirgi yangilanish” sanasi yangilanadi."]}, {"title": "12. Aloqa", "paragraphs": ["Maxfiylik siyosati va ma'lumotlarni qayta ishlash bo'yicha: <a href=\"mailto:hayhak1@gmail.com\">hayhak1@gmail.com</a>"]}], "footer": "© 2026 Turk lug'ati · com.hayhak.turkcesozluk"}, "vi": {"title": "Chính sách quyền riêng tư", "pageTitle": "Chính sách quyền riêng tư — Từ điển tiếng Thổ Nhĩ Kỳ", "metaApp": "Ứng dụng", "metaPackage": "tên gói", "metaDeveloper": "Nhà phát triển", "metaUpdated": "Cập nhật lần cuối", "updatedDate": "7 tháng 8 năm 2026", "langLabel": "Ngôn ngữ", "intro": "Chính sách quyền riêng tư này giải thích cách ứng dụng <strong>Từ điển tiếng Thổ Nhĩ Kỳ</strong> trên Google Play xử lý dữ liệu người dùng. Bằng việc tải xuống hoặc sử dụng ứng dụng, bạn đồng ý với chính sách này.", "sections": [{"title": "1. Người kiểm soát dữ liệu và liên hệ", "paragraphs": ["Người kiểm soát dữ liệu / Nhà phát triển: ThunderCraft<br>Email: <a href=\"mailto:hayhak1@gmail.com\">hayhak1@gmail.com</a>", "Đối với các câu hỏi liên quan đến quyền riêng tư, vui lòng liên hệ với chúng tôi qua địa chỉ email ở trên."]}, {"title": "2. Dữ liệu thu thập", "paragraphs": ["Ứng dụng không yêu cầu tạo tài khoản, đăng nhập hoặc đăng ký. Chúng tôi không cố ý thu thập thông tin nhận dạng cá nhân như tên, email, số điện thoại, vị trí chính xác hoặc giấy tờ tùy thân, và không gửi chúng đến máy chủ của chúng tôi. Ứng dụng không có tài khoản người dùng hoặc máy chủ backend riêng."]}, {"title": "3. Dữ liệu lưu trữ cục bộ trên thiết bị của bạn", "paragraphs": ["Dữ liệu sau đây chỉ được lưu trên thiết bị của bạn (bộ nhớ cục bộ / cơ sở dữ liệu) và không được xuất khỏi thiết bị:", "Khi bạn gỡ cài đặt ứng dụng, dữ liệu cục bộ này cũng bị xóa khỏi thiết bị của bạn."], "items": ["Từ yêu thích", "Lịch sử tìm kiếm", "Từ / từ đồng nghĩa do người dùng thêm", "Thống kê trong ứng dụng (ví dụ: hoạt động hàng tuần, chuỗi)", "Cài đặt như chủ đề và chế độ từ điển"]}, {"title": "4. Dữ liệu xử lý qua Internet", "paragraphs": ["Ứng dụng có thể sử dụng kết nối Internet. Khi không tìm thấy từ trong từ điển cục bộ, <strong>văn bản từ</strong> được tìm kiếm có thể được gửi đến <a href=\"https://sozluk.gov.tr\" rel=\"noopener noreferrer\">sozluk.gov.tr</a> (Hiệp hội Ngôn ngữ Thổ Nhĩ Kỳ Güncel Türkçe Sözlük)", "Nếu thiết bị của bạn không có kết nối Internet hoặc TDK không phản hồi, kết quả trực tuyến sẽ không hiển thị; các tính năng từ điển cục bộ vẫn hoạt động."], "items": ["Dữ liệu gửi: chỉ từ được nhập trong ô tìm kiếm", "Mục đích: hiển thị nghĩa / định nghĩa từ điển", "Không gửi thông tin nhận dạng cá nhân", "Yêu cầu này được gửi đến trang web công khai của TDK; ứng dụng không có quan hệ đối tác chính thức với TDK"]}, {"title": "5. Quyền", "paragraphs": [], "items": ["<strong>Internet (INTERNET):</strong> Dùng để truy vấn từ điển TDK cho các từ không tìm thấy cục bộ.", "<strong>Thông báo (POST_NOTIFICATIONS):</strong> Tùy chọn. Được yêu cầu để hiển thị thông báo “Từ trong ngày”. Có thể tắt trong cài đặt thiết bị.", "<strong>Tìm kiếm bằng giọng nói / micrô:</strong> Khi bạn chạm biểu tượng micrô, dịch vụ nhận dạng giọng nói của thiết bị (ví dụ: Google) có thể mở. Chúng tôi không lưu bản ghi âm; chỉ văn bản được nhận dạng được đặt vào ô tìm kiếm."]}, {"title": "6. Bên thứ ba", "paragraphs": ["Ứng dụng có thể tương tác với các dịch vụ bên thứ ba sau:", "Chúng tôi không sử dụng SDK quảng cáo, SDK phân tích hoặc công cụ theo dõi người dùng."], "items": ["<strong>Google Play / Play Store:</strong> Phân phối ứng dụng và mở trang Play Store qua “Đánh giá chúng tôi”. Quy trình này do Google quản lý.", "<strong>sozluk.gov.tr (TDK):</strong> Tra cứu định nghĩa cho từ không tìm thấy cục bộ. Chỉ từ được tìm kiếm được truyền.", "<strong>Dịch vụ nhận dạng giọng nói của thiết bị:</strong> Khi người dùng bắt đầu tìm kiếm bằng giọng nói."]}, {"title": "7. Chia sẻ và bán dữ liệu", "paragraphs": ["Chúng tôi không bán dữ liệu người dùng. Chúng tôi không tạo hồ sơ người dùng trên máy chủ của mình. Như mô tả ở Mục 4, chỉ từ được tìm kiếm có thể được gửi đến trang web TDK để tra cứu từ điển."]}, {"title": "8. Bảo mật dữ liệu", "paragraphs": ["Dữ liệu cục bộ ở lại trên thiết bị của bạn. Truy vấn từ điển trực tuyến được thực hiện qua HTTPS. Không có biện pháp bảo mật nào là tuyệt đối; chúng tôi khuyên bạn nên cập nhật thiết bị."]}, {"title": "9. Quyền riêng tư của trẻ em", "paragraphs": ["Ứng dụng là ứng dụng học ngôn ngữ / từ điển chung. Chúng tôi không cố ý thu thập dữ liệu cá nhân từ trẻ em dưới 13 tuổi. Phụ huynh nên giám sát việc sử dụng ứng dụng của con cái."]}, {"title": "10. Quyền của bạn", "paragraphs": ["Bạn có thể xóa dữ liệu cục bộ trong ứng dụng (ví dụ: bằng cách xóa mục yêu thích) hoặc bằng cách gỡ cài đặt ứng dụng. Đối với câu hỏi về truy vấn trực tuyến, hãy viết đến <a href=\"mailto:hayhak1@gmail.com\">hayhak1@gmail.com</a>."]}, {"title": "11. Thay đổi chính sách này", "paragraphs": ["Chính sách này có thể được cập nhật theo thời gian. Phiên bản hiện tại được công bố trên trang này. Ngày “Cập nhật lần cuối” được sửa đổi cho các thay đổi quan trọng."]}, {"title": "12. Liên hệ", "paragraphs": ["Về chính sách quyền riêng tư và xử lý dữ liệu: <a href=\"mailto:hayhak1@gmail.com\">hayhak1@gmail.com</a>"]}], "footer": "© 2026 Từ điển tiếng Thổ Nhĩ Kỳ · com.hayhak.turkcesozluk"}, "zh-CN": {"title": "隐私政策", "pageTitle": "隐私政策 — 土耳其语词典", "metaApp": "应用", "metaPackage": "包名", "metaDeveloper": "开发者", "metaUpdated": "最后更新", "updatedDate": "2026年8月7日", "langLabel": "语言", "intro": "本隐私政策说明了 Google Play 上提供的<strong>土耳其语词典</strong>应用如何处理用户数据。下载或使用本应用即表示您同意本政策。", "sections": [{"title": "1. 数据控制者与联系方式", "paragraphs": ["数据控制者 / 开发者：ThunderCraft<br>电子邮件：<a href=\"mailto:hayhak1@gmail.com\">hayhak1@gmail.com</a>", "如有隐私相关问题，请通过上述电子邮件地址联系我们。"]}, {"title": "2. 收集的数据", "paragraphs": ["本应用不需要创建账户、登录或注册。我们不会故意收集姓名、电子邮件、电话号码、精确位置或身份证件等个人身份信息，也不会将其发送至我们的服务器。本应用没有自己的用户账户或后端服务器。"]}, {"title": "3. 设备本地存储的数据", "paragraphs": ["以下数据仅存储在您的设备上（本地存储 / 数据库），不会从设备导出：", "卸载应用后，这些本地数据也会从您的设备中删除。"], "items": ["收藏的单词", "搜索历史", "用户添加的单词 / 同义词", "应用内统计（如每周活动、连续天数）", "主题和词典模式等设置"]}, {"title": "4. 通过互联网处理的数据", "paragraphs": ["本应用可能使用互联网连接。当本地词典中找不到某个单词时，为获取释义，搜索的<strong>单词文本</strong>可能会发送至 <a href=\"https://sozluk.gov.tr\" rel=\"noopener noreferrer\">sozluk.gov.tr</a>（土耳其语言协会 Güncel Türkçe Sözlük）", "如果设备没有互联网连接或 TDK 无响应，则不会显示在线结果；本地词典功能仍可正常使用。"], "items": ["发送的数据：仅搜索框中输入的单词", "目的：显示词典释义 / 定义信息", "不发送个人身份信息", "该请求发送至 TDK 的公开网站；本应用与 TDK 没有正式合作关系"]}, {"title": "5. 权限", "paragraphs": [], "items": ["<strong>互联网 (INTERNET)：</strong>用于查询本地未找到的单词的 TDK 词典。", "<strong>通知 (POST_NOTIFICATIONS)：</strong>可选。用于显示“每日一词”通知。可在设备设置中关闭。", "<strong>语音搜索 / 麦克风：</strong>点击麦克风图标时，可能会打开设备的语音识别服务（如 Google）。我们不存储音频录音；仅将识别的文本放入搜索框。"]}, {"title": "6. 第三方", "paragraphs": ["本应用可能与以下第三方服务交互：", "我们不使用广告 SDK、分析 SDK 或用户跟踪工具。"], "items": ["<strong>Google Play / Play Store：</strong>应用分发及通过“评价我们”打开 Play Store 页面。此过程由 Google 管理。", "<strong>sozluk.gov.tr (TDK)：</strong>查询本地未找到单词的释义。仅传输搜索的单词。", "<strong>设备语音识别服务：</strong>用户启动语音搜索时。"]}, {"title": "7. 数据共享与出售", "paragraphs": ["我们不出售用户数据。我们不在自己的服务器上创建用户档案。如第 4 节所述，仅为词典查询目的，搜索的单词可能会发送至 TDK 网站。"]}, {"title": "8. 数据安全", "paragraphs": ["本地数据保留在您的设备上。在线词典查询通过 HTTPS 进行。没有任何安全措施是绝对安全的；建议您保持设备更新。"]}, {"title": "9. 儿童隐私", "paragraphs": ["本应用是通用的语言学习 / 词典应用。我们不会故意收集 13 岁以下儿童的个人信息。家长应监督儿童使用本应用。"]}, {"title": "10. 您的权利", "paragraphs": ["您可以在应用内删除本地数据（如移除收藏）或通过卸载应用来删除。有关在线查询的问题，请写信至 <a href=\"mailto:hayhak1@gmail.com\">hayhak1@gmail.com</a>。"]}, {"title": "11. 政策变更", "paragraphs": ["本政策可能会不时更新。当前版本发布在本页面。重大变更时会更改“最后更新”日期。"]}, {"title": "12. 联系方式", "paragraphs": ["有关隐私政策和数据处理：<a href=\"mailto:hayhak1@gmail.com\">hayhak1@gmail.com</a>"]}], "footer": "© 2026 土耳其语词典 · com.hayhak.turkcesozluk"}};
    const FALLBACK = "en";

    function resolveLang(requested) {
      if (!requested) return "tr";
      if (I18N[requested]) return requested;
      if (requested.startsWith("tr")) return "tr";
      const primary = requested.split("-")[0];
      if (I18N[primary]) return primary;
      return FALLBACK;
    }

    function renderContent(lang) {
      const resolved = resolveLang(lang);
      const t = I18N[resolved] || I18N[FALLBACK] || I18N.tr;
      document.documentElement.lang = resolved;
      document.title = t.pageTitle;
      const langLabel = document.getElementById("lang-label");
      if (langLabel) langLabel.textContent = t.langLabel;
      document.getElementById("title").textContent = t.title;
      document.getElementById("meta").innerHTML =
        t.metaApp + ': <strong>Türkçe Sözlük</strong> (' + t.metaPackage +
        ': <code>com.hayhak.turkcesozluk</code>)<br>' +
        t.metaDeveloper + ': ThunderCraft<br>' +
        t.metaUpdated + ': ' + t.updatedDate;

      let html = '<p>' + t.intro + '</p>';
      for (const s of t.sections) {
        html += '<h2>' + s.title + '</h2>';
        for (const p of s.paragraphs) {
          if (p) html += '<p>' + p + '</p>';
        }
        if (s.items && s.items.length) {
          html += '<ul>';
          for (const item of s.items) html += '<li>' + item + '</li>';
          html += '</ul>';
        }
      }
      document.getElementById("content").innerHTML = html;
      document.getElementById("footer").textContent = t.footer;

      const select = document.getElementById("lang-select");
      if (!select) return resolved;
      select.innerHTML = "";
      for (const [code, label] of Object.entries(LANG_LABELS)) {
        const opt = document.createElement("option");
        opt.value = code;
        opt.textContent = label;
        select.appendChild(opt);
      }
      select.value = lang in LANG_LABELS ? lang : resolved;
      return resolved;
    }

    window.renderPrivacyPolicy = function(lang) {
      renderContent(lang);
    };

    renderContent('tr');
</script>
