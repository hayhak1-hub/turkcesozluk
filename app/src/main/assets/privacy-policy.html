    const I18N = {"ar": {"title": "سياسة الخصوصية", "pageTitle": "سياسة الخصوصية — قاموس التركية", "metaApp": "التطبيق", "metaPackage": "اسم الحزمة", "metaDeveloper": "المطور", "metaUpdated": "آخر تحديث", "updatedDate": "7 أغسطس 2026", "langLabel": "اللغة", "intro": "توضح سياسة الخصوصية هذه كيفية تعامل تطبيق <strong>قاموس التركية</strong> المتاح على Google Play مع بيانات المستخدم. بتنزيل التطبيق أو استخدامه، فإنك توافق على هذه السياسة.", "sections": [{"title": "1. مسؤول البيانات والاتصال", "paragraphs": ["مسؤول البيانات / المطور: ThunderCraft<br>البريد الإلكتروني: <a href=\"mailto:hayhak1@gmail.com\">hayhak1@gmail.com</a>", "للأسئلة المتعلقة بالخصوصية، تواصل معنا عبر عنوان البريد الإلكتروني أعلاه."]}, {"title": "2. البيانات المجمعة", "paragraphs": ["لا يتطلب التطبيق إنشاء حساب أو تسجيل الدخول أو التسجيل. لا نجمع عن قصد معرفات شخصية مثل الاسم أو البريد الإلكتروني أو رقم الهاتف أو الموقع الدقيق أو وثائق الهوية، ولا نرسلها إلى خوادمنا. ليس للتطبيق حساب مستخدم أو خادم خلفي خاص به."]}, {"title": "3. البيانات المخزنة محليًا على جهازك", "paragraphs": ["تُخزَّن البيانات التالية فقط على جهازك (التخزين المحلي / قاعدة البيانات) ولا تُصدَّر من جهازك:", "عند إلغاء تثبيت التطبيق، تُزال هذه البيانات المحلية من جهازك."], "items": ["الكلمات المفضلة", "سجل البحث", "الكلمات / المرادفات المضافة من المستخدم", "إحصائيات داخل التطبيق (مثل النشاط الأسبوعي، السلسلة)", "الإعدادات مثل السمة ووضع القاموس"]}, {"title": "4. البيانات المعالجة عبر الإنترنت", "paragraphs": ["قد يستخدم التطبيق اتصالاً بالإنترنت. عندما لا تُوجَد كلمة في القاموس المحلي، قد يُرسَل <strong>نص الكلمة</strong> المبحوث عنها إلى <a href=\"https://sozluk.gov.tr\" rel=\"noopener noreferrer\">sozluk.gov.tr</a> (جمعية اللغة التركية Güncel Türkçe Sözlük)", "إذا لم يكن لجهازك اتصال بالإنترنت أو لم يستجب TDK، لا يُعرَض النتيجة عبر الإنترنت؛ تستمر ميزات القاموس المحلي في العمل."], "items": ["البيانات المرسلة: الكلمة المكتوبة في مربع البحث فقط", "الغرض: عرض معنى / تعريف القاموس", "لا تُرسَل معلومات الهوية الشخصية", "يُجرى هذا الطلب إلى الموقع العام لـ TDK؛ التطبيق ليس في شراكة رسمية مع TDK"]}, {"title": "5. الأذونات", "paragraphs": [], "items": ["<strong>الإنترنت (INTERNET):</strong> يُستخدم للاستعلام عن قاموس TDK للكلمات غير الموجودة محليًا.", "<strong>الإشعارات (POST_NOTIFICATIONS):</strong> اختياري. يُطلب لعرض إشعار «كلمة اليوم». يمكن تعطيله في إعدادات الجهاز.", "<strong>البحث الصوتي / الميكروفون:</strong> عند النقر على أيقونة الميكروفون، قد تُفتح خدمة التعرف على الكلام في جهازك (مثل Google). لا نخزن تسجيلات صوتية؛ يُوضَع النص المعترف به فقط في مربع البحث."]}, {"title": "6. الأطراف الثالثة", "paragraphs": ["قد يتفاعل التطبيق مع خدمات الأطراف الثالثة التالية:", "لا نستخدم SDK للإعلانات أو SDK للتحليلات أو أدوات تتبع المستخدم."], "items": ["<strong>Google Play / Play Store:</strong> توزيع التطبيق وفتح صفحة Play Store عبر «قيّمنا». تُدار هذه العملية بواسطة Google.", "<strong>sozluk.gov.tr (TDK):</strong> البحث عن تعريفات للكلمات غير الموجودة محليًا. تُرسَل الكلمة المبحوث عنها فقط.", "<strong>خدمة التعرف على الكلام في الجهاز:</strong> عندما يبدأ المستخدم البحث الصوتي."]}, {"title": "7. مشاركة البيانات وبيعها", "paragraphs": ["لا نبيع بيانات المستخدم. لا ننشئ ملفات تعريف للمستخدم على خوادمنا. كما هو موضح في القسم 4، قد تُرسَل الكلمة المبحوث عنها فقط إلى موقع TDK للاستعلام عن القاموس."]}, {"title": "8. أمان البيانات", "paragraphs": ["تبقى البيانات المحلية على جهازك. تُجرى استعلامات القاموس عبر الإنترنت عبر HTTPS. لا توجد إجراءات أمان مطلقة؛ نوصي بإبقاء جهازك محدثًا."]}, {"title": "9. خصوصية الأطفال", "paragraphs": ["التطبيق تطبيق عام لتعلم اللغة / قاموس. لا نجمع عن قصد بيانات شخصية من الأطفال دون 13 عامًا. يجب على الآباء الإشراف على استخدام أطفالهم للتطبيق."]}, {"title": "10. حقوقك", "paragraphs": ["يمكنك حذف البيانات المحلية في التطبيق (مثل إزالة المفضلة) أو بإلغاء تثبيت التطبيق. للأسئلة حول الاستعلامات عبر الإنترنت، اكتب إلى <a href=\"mailto:hayhak1@gmail.com\">hayhak1@gmail.com</a>."]}, {"title": "11. التغييرات على هذه السياسة", "paragraphs": ["قد تُحدَّث هذه السياسة من وقت لآخر. يُنشر الإصدار الحالي على هذه الصفحة. يُراجع تاريخ «آخر تحديث» للتغييرات المهمة."]}, {"title": "12. الاتصال", "paragraphs": ["للاستفسار عن سياسة الخصوصية ومعالجة البيانات: <a href=\"mailto:hayhak1@gmail.com\">hayhak1@gmail.com</a>"]}], "footer": "© 2026 قاموس التركية · com.hayhak.turkcesozluk"}, "az": {"title": "Məxfilik siyasəti", "pageTitle": "Məxfilik siyasəti — Türk Lüğəti", "metaApp": "Tətbiq", "metaPackage": "paket adı", "metaDeveloper": "İnkişafçı", "metaUpdated": "Son yenilənmə", "updatedDate": "7 avqust 2026", "langLabel": "Dil", "intro": "Bu məxfilik siyasəti Google Play-də təqdim olunan <strong>Türk Lüğəti</strong> tətbiqinin istifadəçi məlumatlarını necə emal etdiyini izah edir. Tətbiqi yükləyərək və ya istifadə edərək bu siyasəti qəbul etmiş sayılırsınız.", "sections": [{"title": "1. Məlumat Məsul Şəxsi və Əlaqə", "paragraphs": ["Məlumat məsul şəxsi / İnkişafçı: ThunderCraft<br>E-poçt: <a href=\"mailto:hayhak1@gmail.com\">hayhak1@gmail.com</a>", "Məxfiliklə bağlı suallarınız üçün yuxarıdakı e-poçt ünvanından bizimlə əlaqə saxlaya bilərsiniz."]}, {"title": "2. Toplanan Məlumatlar", "paragraphs": ["Tətbiq hesab yaratma, giriş və ya qeydiyyat tələb etmir. Ad, soyad, e-poçt, telefon nömrəsi, dəqiq yer və ya şəxsiyyət sənədi kimi şəxsi identifikasiya məlumatlarını qəsdən toplamırıq və öz serverlərimizə göndərmirik. Tətbiqin öz istifadəçi hesabı və ya backend serveri yoxdur."]}, {"title": "3. Cihazda Yerli Olaraq Saxlanılan Məlumatlar", "paragraphs": ["Aşağıdakı məlumatlar yalnız cihazınızda (yerli yaddaş / verilənlər bazası) saxlanılır və cihazınızdan kənara ötürülmür:", "Tətbiqi siləndə bu yerli məlumatlar da cihazınızdan silinir."], "items": ["Sevimli sözlər", "Axtarış tarixçəsi", "İstifadəçinin əlavə etdiyi sözlər / sinonimlər", "Tətbiq daxili statistika (məs. həftəlik fəaliyyət, seriya)", "Tema və lüğət rejimi kimi parametrlər"]}, {"title": "4. İnternet Üzərindən Emal Olunan Məlumatlar", "paragraphs": ["Tətbiq internet bağlantısından istifadə edə bilər. Yerli lüğətdə tapılmayan söz axtarıldıqda, mənanı almaq üçün axtarılan <strong>söz mətni</strong> <a href=\"https://sozluk.gov.tr\" rel=\"noopener noreferrer\">sozluk.gov.tr</a> (Türk Dil Qurumu Güncel Türkçe Sözlük) ünvanına göndərilə bilər.", "Cihazınızın internet bağlantısı yoxdursa və ya TDK cavab vermirsə, onlayn nəticə göstərilmir; yerli lüğət funksiyaları işləməyə davam edir."], "items": ["Göndərilən məlumat: yalnız axtarış qutusuna yazılan söz", "Məqsəd: lüğət mənası / tərif məlumatını göstərmək", "Şəxsi identifikasiya məlumatı göndərilmir", "Bu sorğu TDK-nın ictimai saytına edilir; tətbiq TDK ilə rəsmi tərəfdaşlıqda deyil"]}, {"title": "5. İcazələr", "paragraphs": [], "items": ["<strong>İnternet (INTERNET):</strong> Yerli olaraq tapılmayan sözlər üçün TDK lüğət sorğusu aparmaq məqsədilə istifadə olunur.", "<strong>Bildirişlər (POST_NOTIFICATIONS):</strong> İstəyə bağlıdır. “Günün sözü” bildirişini göstərmək üçün tələb olunur. Cihaz parametrlərindən söndürülə bilər.", "<strong>Səsli axtarış / mikrofon:</strong> Mikrofon simgesinə toxunduqda cihazınızın öz səs tanıma xidməti (məs. Google) açıla bilər. Səs qeydləri tətbiqimiz tərəfindən saxlanılmır; yalnız tanınan mətn axtarış qutusuna yazılır."]}, {"title": "6. Üçüncü Tərəflər", "paragraphs": ["Tətbiq aşağıdakı üçüncü tərəf xidmətləri ilə qarşılıqlı əlaqədə ola bilər:", "Reklam SDK-sı, analitika SDK-sı və ya istifadəçi izləmə alətləri istifadə etmirik."], "items": ["<strong>Google Play / Play Store:</strong> Tətbiqin paylanması və “Bizi qiymətləndirin” vasitəsilə Play Store səhifəsinin açılması üçün. Bu proses Google tərəfindən idarə olunur.", "<strong>sozluk.gov.tr (TDK):</strong> Yerli olaraq tapılmayan sözlər üçün mənə sorğusu. Yalnız axtarılan söz ötürülür.", "<strong>Cihaz səs tanıma xidməti:</strong> İstifadəçi səsli axtarışı başlatdıqda."]}, {"title": "7. Məlumatların Paylaşılması və Satışı", "paragraphs": ["İstifadəçi məlumatlarını satmırıq. Öz serverlərimizdə istifadəçi profili yaratmırıq. 4-cü bölmədə izah olunduğu kimi, yalnız lüğət sorğusu üçün axtarılan söz TDK saytına ötürülə bilər."]}, {"title": "8. Məlumat Təhlükəsizliyi", "paragraphs": ["Yerli məlumatlar cihazınızda saxlanılır. Onlayn lüğət sorğuları HTTPS vasitəsilə aparılır. Heç bir təhlükəsizlik tədbiri mütləq deyil; cihazınızı yenilək saxlamağı tövsiyə edirik."]}, {"title": "9. Uşaqların Məxfiliyi", "paragraphs": ["Tətbiq ümumi dil öyrənmə / lüğət tətbiqidir. 13 yaşdan kiçik uşaqlardan qəsdən şəxsi məlumat toplamırıq. Valideynlər uşaqlarının tətbiqdən istifadəsini nəzarət etməlidir."]}, {"title": "10. Hüquqlarınız", "paragraphs": ["Yerli məlumatları tətbiqdən (məs. sevimliləri silməklə) və ya tətbiqi silməklə silə bilərsiniz. Onlayn sorğularla bağlı suallarınız üçün <a href=\"mailto:hayhak1@gmail.com\">hayhak1@gmail.com</a> ünvanına yaza bilərsiniz."]}, {"title": "11. Siyasətdə Dəyişikliklər", "paragraphs": ["Bu siyasət zaman zaman yenilənə bilər. Cari versiya bu səhifədə dərc olunur. Əhəmiyyətli dəyişikliklərdə “Son yenilənmə” tarixi yenilənir."]}, {"title": "12. Əlaqə", "paragraphs": ["Məxfilik siyasəti və məlumat emalı barədə: <a href=\"mailto:hayhak1@gmail.com\">hayhak1@gmail.com</a>"]}], "footer": "© 2026 Türk Lüğəti · com.hayhak.turkcesozluk"}, "bn": {"title": "গোপনীয়তা নীতি", "pageTitle": "গোপনীয়তা নীতি — তুর্কি অভিধান", "metaApp": "অ্যাপ", "metaPackage": "প্যাকেজের নাম", "metaDeveloper": "ডেভেলপার", "metaUpdated": "সর্বশেষ আপডেট", "updatedDate": "৭ আগস্ট ২০২৬", "langLabel": "ভাষা", "intro": "এই গোপনীয়তা নীতি ব্যাখ্যা করে Google Play-এ উপলব্ধ <strong>তুর্কি অভিধান</strong> অ্যাপ কীভাবে ব্যবহারকারীর ডেটা পরিচালনা করে। অ্যাপ ডাউনলোড বা ব্যবহার করে আপনি এই নীতিতে সম্মত হন।", "sections": [{"title": "1. ডেটা নিয়ন্ত্রক ও যোগাযোগ", "paragraphs": ["ডেটা নিয়ন্ত্রক / ডেভেলপার: ThunderCraft<br>ইমেইল: <a href=\"mailto:hayhak1@gmail.com\">hayhak1@gmail.com</a>", "গোপনীয়তা সংক্রান্ত প্রশ্নের জন্য উপরের ইমেইল ঠিকানায় আমাদের সাথে যোগাযোগ করুন।"]}, {"title": "2. সংগৃহীত ডেটা", "paragraphs": ["অ্যাপে অ্যাকাউন্ট তৈরি, সাইন-ইন বা নিবন্ধনের প্রয়োজন নেই। আমরা জেনেশুনে নাম, ইমেইল, ফোন নম্বর, সুনির্দিষ্ট অবস্থান বা পরিচয়পত্রের মতো ব্যক্তিগত শনাক্তকারী সংগ্রহ করি না এবং সেগুলো আমাদের সার্ভারে পাঠাই না। অ্যাপের নিজস্ব ব্যবহারকারী অ্যাকাউন্ট বা ব্যাকএন্ড সার্ভার নেই।"]}, {"title": "3. আপনার ডিভাইসে স্থানীয়ভাবে সংরক্ষিত ডেটা", "paragraphs": ["নিম্নলিখিত ডেটা শুধুমাত্র আপনার ডিভাইসে (স্থানীয় স্টোরেজ / ডাটাবেস) সংরক্ষিত হয় এবং ডিভাইস থেকে রপ্তানি হয় না:", "অ্যাপ আনইনস্টল করলে এই স্থানীয় ডেটা আপনার ডিভাইস থেকে সরানো হয়।"], "items": ["প্রিয় শব্দ", "অনুসন্ধানের ইতিহাস", "ব্যবহারকারী-যোগ করা শব্দ / প্রতিশব্দ", "অ্যাপ-ভিতরের পরিসংখ্যান (যেমন সাপ্তাহিক কার্যকলাপ, ধারাবাহিকতা)", "থিম ও অভিধান মোডের মতো সেটিংস"]}, {"title": "4. ইন্টারনেটের মাধ্যমে প্রক্রিয়াজাত ডেটা", "paragraphs": ["অ্যাপ ইন্টারনেট সংযোগ ব্যবহার করতে পারে। স্থানীয় অভিধানে কোনো শব্দ না পেলে, সংজ্ঞা পেতে অনুসন্ধান করা <strong>শব্দের পাঠ</strong> <a href=\"https://sozluk.gov.tr\" rel=\"noopener noreferrer\">sozluk.gov.tr</a> (তুর্কি ভাষা সমিতি Güncel Türkçe Sözlük)-এ পাঠানো হতে পারে।", "ডিভাইসে ইন্টারনেট সংযোগ না থাকলে বা TDK সাড়া না দিলে, অনলাইন ফলাফল দেখানো হয় না; স্থানীয় অভিধান বৈশিষ্ট্য কাজ চালিয়ে যায়।"], "items": ["পাঠানো ডেটা: শুধু অনুসন্ধান বাক্সে টাইপ করা শব্দ", "উদ্দেশ্য: অভিধানের অর্থ / সংজ্ঞা দেখানো", "কোনো ব্যক্তিগত পরিচয় তথ্য পাঠানো হয় না", "এই অনুরোধ TDK-এর সর্বজনীন ওয়েবসাইটে করা হয়; অ্যাপ TDK-এর সাথে আনুষ্ঠানিক অংশীদারিত্বে নেই"]}, {"title": "5. অনুমতি", "paragraphs": [], "items": ["<strong>ইন্টারনেট (INTERNET):</strong> স্থানীয়ভাবে না পাওয়া শব্দের জন্য TDK অভিধান অনুসন্ধানের জন্য ব্যবহৃত।", "<strong>বিজ্ঞপ্তি (POST_NOTIFICATIONS):</strong> ঐচ্ছিক। “দিনের শব্দ” বিজ্ঞপ্তি দেখাতে অনুরোধ করা হয়। ডিভাইস সেটিংসে নিষ্ক্রিয় করা যায়।", "<strong>ভয়েস সার্চ / মাইক্রোফোন:</strong> মাইক্রোফোন আইকনে ট্যাপ করলে আপনার ডিভাইসের স্পিচ রিকগনিশন সার্ভিস (যেমন Google) খুলতে পারে। আমরা অডিও রেকর্ডিং সংরক্ষণ করি না; শুধু স্বীকৃত টেক্সট অনুসন্ধান বাক্সে রাখা হয়।"]}, {"title": "6. তৃতীয় পক্ষ", "paragraphs": ["অ্যাপ নিম্নলিখিত তৃতীয়-পক্ষ সেবার সাথে interact করতে পারে:", "আমরা বিজ্ঞাপন SDK, বিশ্লেষণ SDK বা ব্যবহারকারী ট্র্যাকিং সরঞ্জাম ব্যবহার করি না।"], "items": ["<strong>Google Play / Play Store:</strong> অ্যাপ বিতরণ এবং “আমাদের রেট করুন”-এর মাধ্যমে Play Store পৃষ্ঠা খোলা। এই প্রক্রিয়া Google পরিচালনা করে।", "<strong>sozluk.gov.tr (TDK):</strong> স্থানীয়ভাবে না পাওয়া শব্দের সংজ্ঞা অনুসন্ধান। শুধু অনুসন্ধান করা শব্দ প্রেরিত হয়।", "<strong>ডিভাইস স্পিচ রিকগনিশন সার্ভিস:</strong> ব্যবহারকারী ভয়েস সার্চ শুরু করলে।"]}, {"title": "7. ডেটা শেয়ারিং ও বিক্রয়", "paragraphs": ["আমরা ব্যবহারকারীর ডেটা বিক্রি করি না। আমাদের সার্ভারে ব্যবহারকারী প্রোফাইল তৈরি করি না। অনুচ্ছেদ 4-এ বর্ণিত অনুযায়ী, শুধু অনুসন্ধান করা শব্দ অভিধান অনুসন্ধানের জন্য TDK ওয়েবসাইটে পাঠানো হতে পারে।"]}, {"title": "8. ডেটা নিরাপত্তা", "paragraphs": ["স্থানীয় ডেটা আপনার ডিভাইসে থাকে। অনলাইন অভিধান অনুসন্ধান HTTPS-এর মাধ্যমে করা হয়। কোনো নিরাপত্তা ব্যবস্থা সম্পূর্ণ নয়; ডিভাইস আপডেট রাখার পরামর্শ দিই।"]}, {"title": "9. শিশুদের গোপনীয়তা", "paragraphs": ["অ্যাপটি একটি সাধারণ ভাষা শেখার / অভিধান অ্যাপ। আমরা জেনেশুনে 13 বছরের কম বয়সী শিশুদের ব্যক্তিগত ডেটা সংগ্রহ করি না। অভিভাবকদের সন্তানদের অ্যাপ ব্যবহার তদারকি করা উচিত।"]}, {"title": "10. আপনার অধিকার", "paragraphs": ["অ্যাপে স্থানীয় ডেটা (যেমন প্রিয় সরিয়ে) বা অ্যাপ আনইনস্টল করে মুছতে পারেন। অনলাইন অনুসন্ধান সম্পর্কে প্রশ্নের জন্য <a href=\"mailto:hayhak1@gmail.com\">hayhak1@gmail.com</a>-এ লিখুন।"]}, {"title": "11. এই নীতিতে পরিবর্তন", "paragraphs": ["এই নীতি সময়ে সময়ে আপডেট হতে পারে। বর্তমান সংস্করণ এই পৃষ্ঠায় প্রকাশিত হয়। গুরুত্বপূর্ণ পরিবর্তনে “সর্বশেষ আপডেট” তারিখ সংশোধিত হয়।"]}, {"title": "12. যোগাযোগ", "paragraphs": ["গোপনীয়তা নীতি ও ডেটা প্রক্রিয়াকরণের জন্য: <a href=\"mailto:hayhak1@gmail.com\">hayhak1@gmail.com</a>"]}], "footer": "© 2026 তুর্কি অভিধান · com.hayhak.turkcesozluk"}, "de": {"title": "Datenschutzerklärung", "pageTitle": "Datenschutzerklärung — Türkisches Wörterbuch", "metaApp": "App", "metaPackage": "Paketname", "metaDeveloper": "Entwickler", "metaUpdated": "Zuletzt aktualisiert", "updatedDate": "7. August 2026", "langLabel": "Sprache", "intro": "Diese Datenschutzerklärung erläutert, wie die App <strong>Türkisches Wörterbuch</strong> über Google Play Nutzerdaten verarbeitet. Durch das Herunterladen oder Verwenden der App stimmen Sie dieser Richtlinie zu.", "sections": [{"title": "1. Verantwortlicher und Kontakt", "paragraphs": ["Verantwortlicher / Entwickler: ThunderCraft<br>E-Mail: <a href=\"mailto:hayhak1@gmail.com\">hayhak1@gmail.com</a>", "Bei Fragen zum Datenschutz erreichen Sie uns unter der obigen E-Mail-Adresse."]}, {"title": "2. Erhobene Daten", "paragraphs": ["Die App erfordert keine Kontoerstellung, Anmeldung oder Registrierung. Wir erheben wissentlich keine personenbezogenen Identifikationsdaten wie Name, E-Mail, Telefonnummer, genauen Standort oder Ausweisdokumente und senden diese nicht an unsere eigenen Server. Die App verfügt über kein eigenes Benutzerkonto oder Backend."]}, {"title": "3. Lokal auf dem Gerät gespeicherte Daten", "paragraphs": ["Die folgenden Daten werden nur auf Ihrem Gerät (lokaler Speicher / Datenbank) gespeichert und nicht vom Gerät exportiert:", "Wenn Sie die App deinstallieren, werden diese lokalen Daten von Ihrem Gerät entfernt."], "items": ["Favorisierte Wörter", "Suchverlauf", "Vom Benutzer hinzugefügte Wörter / Synonyme", "In-App-Statistiken (z. B. wöchentliche Aktivität, Serie)", "Einstellungen wie Theme und Wörterbuchmodus"]}, {"title": "4. Über das Internet verarbeitete Daten", "paragraphs": ["Die App kann eine Internetverbindung nutzen. Wird ein Wort im lokalen Wörterbuch nicht gefunden, kann der gesuchte <strong>Worttext</strong> an <a href=\"https://sozluk.gov.tr\" rel=\"noopener noreferrer\">sozluk.gov.tr</a> (Güncel Türkçe Sözlük der Türkischen Sprachgesellschaft) gesendet werden, um Definitionen abzurufen.", "Ohne Internetverbindung oder wenn TDK nicht antwortet, wird kein Online-Ergebnis angezeigt; lokale Wörterbuchfunktionen funktionieren weiter."], "items": ["Gesendete Daten: nur das in das Suchfeld eingegebene Wort", "Zweck: Anzeige von Wörterbuchbedeutung / Definition", "Es werden keine persönlichen Identifikationsdaten gesendet", "Die Anfrage geht an die öffentliche TDK-Website; die App steht nicht in offizieller Partnerschaft mit TDK"]}, {"title": "5. Berechtigungen", "paragraphs": [], "items": ["<strong>Internet (INTERNET):</strong> Für TDK-Wörterbuchabfragen zu lokal nicht gefundenen Wörtern.", "<strong>Benachrichtigungen (POST_NOTIFICATIONS):</strong> Optional. Für die Benachrichtigung „Wort des Tages“. In den Geräteeinstellungen deaktivierbar.", "<strong>Sprachsuche / Mikrofon:</strong> Beim Tippen auf das Mikrofonsymbol kann der Spracherkennungsdienst des Geräts (z. B. Google) geöffnet werden. Wir speichern keine Audioaufnahmen; nur der erkannte Text wird ins Suchfeld eingetragen."]}, {"title": "6. Drittanbieter", "paragraphs": ["Die App kann mit folgenden Drittanbieterdiensten interagieren:", "Wir verwenden keine Werbe-SDKs, Analyse-SDKs oder Tracking-Tools."], "items": ["<strong>Google Play / Play Store:</strong> App-Verteilung und Öffnen der Play-Store-Seite über „Bewerten“.", "<strong>sozluk.gov.tr (TDK):</strong> Definitionsabfrage für lokal nicht gefundene Wörter. Es wird nur das gesuchte Wort übermittelt.", "<strong>Spracherkennungsdienst des Geräts:</strong> Wenn der Benutzer die Sprachsuche startet."]}, {"title": "7. Weitergabe und Verkauf von Daten", "paragraphs": ["Wir verkaufen keine Nutzerdaten. Wir erstellen keine Nutzerprofile auf eigenen Servern. Wie in Abschnitt 4 beschrieben, kann nur das gesuchte Wort für die Wörterbuchsuche an die TDK-Website gesendet werden."]}, {"title": "8. Datensicherheit", "paragraphs": ["Lokale Daten verbleiben auf Ihrem Gerät. Online-Wörterbuchabfragen erfolgen über HTTPS. Keine Sicherheitsmaßnahme ist absolut; wir empfehlen, Ihr Gerät aktuell zu halten."]}, {"title": "9. Datenschutz von Kindern", "paragraphs": ["Die App ist eine allgemeine Sprachlern- / Wörterbuch-App. Wir erheben wissentlich keine personenbezogenen Daten von Kindern unter 13 Jahren. Eltern sollten die Nutzung durch ihre Kinder beaufsichtigen."]}, {"title": "10. Ihre Rechte", "paragraphs": ["Lokale Daten können in der App gelöscht werden (z. B. durch Entfernen von Favoriten) oder durch Deinstallation der App. Fragen zu Online-Abfragen: <a href=\"mailto:hayhak1@gmail.com\">hayhak1@gmail.com</a>."]}, {"title": "11. Änderungen dieser Richtlinie", "paragraphs": ["Diese Richtlinie kann von Zeit zu Zeit aktualisiert werden. Die aktuelle Version wird auf dieser Seite veröffentlicht. Bei wesentlichen Änderungen wird das Datum „Zuletzt aktualisiert“ angepasst."]}, {"title": "12. Kontakt", "paragraphs": ["Datenschutz und Datenverarbeitung: <a href=\"mailto:hayhak1@gmail.com\">hayhak1@gmail.com</a>"]}], "footer": "© 2026 Türkisches Wörterbuch · com.hayhak.turkcesozluk"}, "en": {"title": "Privacy Policy", "pageTitle": "Privacy Policy — Turkish Dictionary", "metaApp": "App", "metaPackage": "package name", "metaDeveloper": "Developer", "metaUpdated": "Last updated", "updatedDate": "August 7, 2026", "langLabel": "Language", "intro": "This privacy policy explains how the <strong>Turkish Dictionary</strong> app available on Google Play handles user data. By downloading or using the app, you agree to this policy.", "sections": [{"title": "1. Data Controller and Contact", "paragraphs": ["Data controller / Developer: ThunderCraft<br>Email: <a href=\"mailto:hayhak1@gmail.com\">hayhak1@gmail.com</a>", "For privacy-related questions, contact us at the email address above."]}, {"title": "2. Data Collected", "paragraphs": ["The app does not require account creation, sign-in, or registration. We do not knowingly collect personal identifiers such as name, email, phone number, precise location, or ID documents, and we do not send them to our own servers. The app has no user account or backend server of its own."]}, {"title": "3. Data Stored Locally on Your Device", "paragraphs": ["The following data is stored only on your device (local storage / database) and is not exported from your device:", "When you uninstall the app, this local data is removed from your device."], "items": ["Favorite words", "Search history", "User-added words / synonyms", "In-app statistics (e.g. weekly activity, streak)", "Settings such as theme and dictionary mode"]}, {"title": "4. Data Processed Over the Internet", "paragraphs": ["The app may use an internet connection. When a word is not found in the local dictionary, the searched <strong>word text</strong> may be sent to <a href=\"https://sozluk.gov.tr\" rel=\"noopener noreferrer\">sozluk.gov.tr</a> (Turkish Language Association Current Turkish Dictionary) to retrieve definition information.", "If your device has no internet connection or TDK does not respond, the online result is not shown; local dictionary features continue to work."], "items": ["Data sent: only the word typed in the search box", "Purpose: to display dictionary meaning / definition", "No personal identity information is sent", "This request is made to TDK's public website; the app is not in an official partnership with TDK"]}, {"title": "5. Permissions", "paragraphs": [], "items": ["<strong>Internet (INTERNET):</strong> Used to query the TDK dictionary for words not found locally.", "<strong>Notifications (POST_NOTIFICATIONS):</strong> Optional. Requested to show the “Word of the day” notification. Can be disabled in device settings.", "<strong>Voice search / microphone:</strong> When you tap the microphone icon, your device's speech recognition service (e.g. Google) may open. We do not store audio recordings; only the recognized text is placed in the search box."]}, {"title": "6. Third Parties", "paragraphs": ["The app may interact with the following third-party services:", "We do not use ad SDKs, analytics SDKs, or user tracking tools."], "items": ["<strong>Google Play / Play Store:</strong> App distribution and opening the Play Store page via “Rate us”. This process is managed by Google.", "<strong>sozluk.gov.tr (TDK):</strong> Definition lookup for words not found locally. Only the searched word is transmitted.", "<strong>Device speech recognition service:</strong> When the user starts voice search."]}, {"title": "7. Data Sharing and Sale", "paragraphs": ["We do not sell user data. We do not create user profiles on our own servers. As described in Section 4, only the searched word may be sent to the TDK website for dictionary lookup."]}, {"title": "8. Data Security", "paragraphs": ["Local data stays on your device. Online dictionary queries are made over HTTPS. No security measure is absolute; we recommend keeping your device up to date."]}, {"title": "9. Children's Privacy", "paragraphs": ["The app is a general language learning / dictionary app. We do not knowingly collect personal data from children under 13. Parents should supervise their children's use of the app."]}, {"title": "10. Your Rights", "paragraphs": ["You can delete local data in the app (e.g. by removing favorites) or by uninstalling the app. For questions about online queries, write to <a href=\"mailto:hayhak1@gmail.com\">hayhak1@gmail.com</a>."]}, {"title": "11. Changes to This Policy", "paragraphs": ["This policy may be updated from time to time. The current version is published on this page. The “Last updated” date is revised for significant changes."]}, {"title": "12. Contact", "paragraphs": ["For privacy policy and data processing: <a href=\"mailto:hayhak1@gmail.com\">hayhak1@gmail.com</a>"]}], "footer": "© 2026 Turkish Dictionary · com.hayhak.turkcesozluk"}, "es": {"title": "Política de privacidad", "pageTitle": "Política de privacidad — Diccionario turco", "metaApp": "Aplicación", "metaPackage": "nombre del paquete", "metaDeveloper": "Desarrollador", "metaUpdated": "Última actualización", "updatedDate": "7 de agosto de 2026", "langLabel": "Idioma", "intro": "Esta política de privacidad explica cómo la aplicación <strong>Diccionario turco</strong> disponible en Google Play gestiona los datos del usuario. Al descargar o usar la aplicación, acepta esta política.", "sections": [{"title": "1. Responsable del tratamiento y contacto", "paragraphs": ["Responsable del tratamiento / Desarrollador: ThunderCraft<br>Correo electrónico: <a href=\"mailto:hayhak1@gmail.com\">hayhak1@gmail.com</a>", "Para preguntas relacionadas con la privacidad, contáctenos en la dirección de correo electrónico anterior."]}, {"title": "2. Datos recopilados", "paragraphs": ["La aplicación no requiere creación de cuenta, inicio de sesión ni registro. No recopilamos deliberadamente identificadores personales como nombre, correo electrónico, número de teléfono, ubicación precisa o documentos de identidad, ni los enviamos a nuestros propios servidores. La aplicación no tiene cuenta de usuario ni servidor backend propio."]}, {"title": "3. Datos almacenados localmente en su dispositivo", "paragraphs": ["Los siguientes datos se almacenan únicamente en su dispositivo (almacenamiento local / base de datos) y no se exportan del dispositivo:", "Al desinstalar la aplicación, estos datos locales se eliminan de su dispositivo."], "items": ["Palabras favoritas", "Historial de búsqueda", "Palabras / sinónimos añadidos por el usuario", "Estadísticas en la aplicación (p. ej., actividad semanal, racha)", "Configuraciones como tema y modo de diccionario"]}, {"title": "4. Datos procesados a través de Internet", "paragraphs": ["La aplicación puede utilizar una conexión a Internet. Cuando no se encuentra una palabra en el diccionario local, el <strong>texto de la palabra</strong> buscada puede enviarse a <a href=\"https://sozluk.gov.tr\" rel=\"noopener noreferrer\">sozluk.gov.tr</a> (Asociación de la Lengua Turca Güncel Türkçe Sözlük)", "Si su dispositivo no tiene conexión a Internet o TDK no responde, no se muestra el resultado en línea; las funciones del diccionario local siguen funcionando."], "items": ["Datos enviados: solo la palabra escrita en el cuadro de búsqueda", "Finalidad: mostrar el significado / definición del diccionario", "No se envía información de identidad personal", "Esta solicitud se realiza al sitio web público de TDK; la aplicación no tiene una asociación oficial con TDK"]}, {"title": "5. Permisos", "paragraphs": [], "items": ["<strong>Internet (INTERNET):</strong> Se utiliza para consultar el diccionario TDK de palabras no encontradas localmente.", "<strong>Notificaciones (POST_NOTIFICATIONS):</strong> Opcional. Se solicita para mostrar la notificación «Palabra del día». Puede desactivarse en la configuración del dispositivo.", "<strong>Búsqueda por voz / micrófono:</strong> Al tocar el icono del micrófono, puede abrirse el servicio de reconocimiento de voz del dispositivo (p. ej., Google). No almacenamos grabaciones de audio; solo el texto reconocido se coloca en el cuadro de búsqueda."]}, {"title": "6. Terceros", "paragraphs": ["La aplicación puede interactuar con los siguientes servicios de terceros:", "No utilizamos SDK de publicidad, SDK de analítica ni herramientas de seguimiento de usuarios."], "items": ["<strong>Google Play / Play Store:</strong> Distribución de la aplicación y apertura de la página de Play Store mediante «Valóranos». Este proceso es gestionado por Google.", "<strong>sozluk.gov.tr (TDK):</strong> Consulta de definiciones de palabras no encontradas localmente. Solo se transmite la palabra buscada.", "<strong>Servicio de reconocimiento de voz del dispositivo:</strong> Cuando el usuario inicia la búsqueda por voz."]}, {"title": "7. Compartición y venta de datos", "paragraphs": ["No vendemos datos de usuarios. No creamos perfiles de usuario en nuestros propios servidores. Como se describe en la Sección 4, solo la palabra buscada puede enviarse al sitio web de TDK para consultas del diccionario."]}, {"title": "8. Seguridad de los datos", "paragraphs": ["Los datos locales permanecen en su dispositivo. Las consultas del diccionario en línea se realizan a través de HTTPS. Ninguna medida de seguridad es absoluta; recomendamos mantener su dispositivo actualizado."]}, {"title": "9. Privacidad de los niños", "paragraphs": ["La aplicación es una aplicación general de aprendizaje de idiomas / diccionario. No recopilamos deliberadamente datos personales de niños menores de 13 años. Los padres deben supervisar el uso de la aplicación por parte de sus hijos."]}, {"title": "10. Sus derechos", "paragraphs": ["Puede eliminar los datos locales en la aplicación (p. ej., eliminando favoritos) o desinstalando la aplicación. Para preguntas sobre consultas en línea, escriba a <a href=\"mailto:hayhak1@gmail.com\">hayhak1@gmail.com</a>."]}, {"title": "11. Cambios en esta política", "paragraphs": ["Esta política puede actualizarse periódicamente. La versión actual se publica en esta página. La fecha de «Última actualización» se revisa para cambios significativos."]}, {"title": "12. Contacto", "paragraphs": ["Para la política de privacidad y el tratamiento de datos: <a href=\"mailto:hayhak1@gmail.com\">hayhak1@gmail.com</a>"]}], "footer": "© 2026 Diccionario turco · com.hayhak.turkcesozluk"}, "fr": {"title": "Politique de confidentialité", "pageTitle": "Politique de confidentialité — Dictionnaire turc", "metaApp": "Application", "metaPackage": "nom du package", "metaDeveloper": "Développeur", "metaUpdated": "Dernière mise à jour", "updatedDate": "7 août 2026", "langLabel": "Langue", "intro": "Cette politique de confidentialité explique comment l'application <strong>Dictionnaire turc</strong> disponible sur Google Play traite les données des utilisateurs. En téléchargeant ou en utilisant l'application, vous acceptez cette politique.", "sections": [{"title": "1. Responsable du traitement et contact", "paragraphs": ["Responsable du traitement / Développeur : ThunderCraft<br>E-mail : <a href=\"mailto:hayhak1@gmail.com\">hayhak1@gmail.com</a>", "Pour toute question relative à la confidentialité, contactez-nous à l'adresse e-mail ci-dessus."]}, {"title": "2. Données collectées", "paragraphs": ["L'application ne nécessite pas la création de compte, la connexion ou l'inscription. Nous ne collectons pas sciemment d'identifiants personnels tels que nom, e-mail, numéro de téléphone, localisation précise ou documents d'identité, et nous ne les envoyons pas à nos propres serveurs. L'application ne dispose pas de compte utilisateur ni de serveur backend propre."]}, {"title": "3. Données stockées localement sur votre appareil", "paragraphs": ["Les données suivantes sont stockées uniquement sur votre appareil (stockage local / base de données) et ne sont pas exportées de votre appareil :", "Lorsque vous désinstallez l'application, ces données locales sont supprimées de votre appareil."], "items": ["Mots favoris", "Historique de recherche", "Mots / synonymes ajoutés par l'utilisateur", "Statistiques dans l'application (p. ex. activité hebdomadaire, série)", "Paramètres tels que le thème et le mode dictionnaire"]}, {"title": "4. Données traitées via Internet", "paragraphs": ["L'application peut utiliser une connexion Internet. Lorsqu'un mot n'est pas trouvé dans le dictionnaire local, le <strong>texte du mot</strong> recherché peut être envoyé à <a href=\"https://sozluk.gov.tr\" rel=\"noopener noreferrer\">sozluk.gov.tr</a> (Association de langue turque Güncel Türkçe Sözlük)", "Si votre appareil n'a pas de connexion Internet ou si TDK ne répond pas, le résultat en ligne n'est pas affiché ; les fonctionnalités du dictionnaire local continuent de fonctionner."], "items": ["Données envoyées : uniquement le mot saisi dans la zone de recherche", "Objectif : afficher le sens / la définition du dictionnaire", "Aucune information d'identité personnelle n'est envoyée", "Cette requête est adressée au site public de TDK ; l'application n'est pas en partenariat officiel avec TDK"]}, {"title": "5. Autorisations", "paragraphs": [], "items": ["<strong>Internet (INTERNET) :</strong> Utilisé pour interroger le dictionnaire TDK pour les mots non trouvés localement.", "<strong>Notifications (POST_NOTIFICATIONS) :</strong> Facultatif. Demandé pour afficher la notification « Mot du jour ». Peut être désactivé dans les paramètres de l'appareil.", "<strong>Recherche vocale / microphone :</strong> Lorsque vous appuyez sur l'icône du microphone, le service de reconnaissance vocale de votre appareil (p. ex. Google) peut s'ouvrir. Nous ne stockons pas d'enregistrements audio ; seul le texte reconnu est placé dans la zone de recherche."]}, {"title": "6. Tiers", "paragraphs": ["L'application peut interagir avec les services tiers suivants :", "Nous n'utilisons pas de SDK publicitaires, de SDK analytiques ni d'outils de suivi des utilisateurs."], "items": ["<strong>Google Play / Play Store :</strong> Distribution de l'application et ouverture de la page Play Store via « Évaluez-nous ». Ce processus est géré par Google.", "<strong>sozluk.gov.tr (TDK) :</strong> Recherche de définitions pour les mots non trouvés localement. Seul le mot recherché est transmis.", "<strong>Service de reconnaissance vocale de l'appareil :</strong> Lorsque l'utilisateur lance la recherche vocale."]}, {"title": "7. Partage et vente des données", "paragraphs": ["Nous ne vendons pas les données des utilisateurs. Nous ne créons pas de profils utilisateur sur nos propres serveurs. Comme décrit à la Section 4, seul le mot recherché peut être envoyé au site TDK pour une consultation du dictionnaire."]}, {"title": "8. Sécurité des données", "paragraphs": ["Les données locales restent sur votre appareil. Les requêtes de dictionnaire en ligne sont effectuées via HTTPS. Aucune mesure de sécurité n'est absolue ; nous recommandons de maintenir votre appareil à jour."]}, {"title": "9. Confidentialité des enfants", "paragraphs": ["L'application est une application générale d'apprentissage des langues / dictionnaire. Nous ne collectons pas sciemment de données personnelles d'enfants de moins de 13 ans. Les parents doivent superviser l'utilisation de l'application par leurs enfants."]}, {"title": "10. Vos droits", "paragraphs": ["Vous pouvez supprimer les données locales dans l'application (p. ex. en supprimant les favoris) ou en désinstallant l'application. Pour toute question concernant les requêtes en ligne, écrivez à <a href=\"mailto:hayhak1@gmail.com\">hayhak1@gmail.com</a>."]}, {"title": "11. Modifications de cette politique", "paragraphs": ["Cette politique peut être mise à jour de temps à autre. La version actuelle est publiée sur cette page. La date de « Dernière mise à jour » est révisée en cas de modifications importantes."]}, {"title": "12. Contact", "paragraphs": ["Pour la politique de confidentialité et le traitement des données : <a href=\"mailto:hayhak1@gmail.com\">hayhak1@gmail.com</a>"]}], "footer": "© 2026 Dictionnaire turc · com.hayhak.turkcesozluk"}, "hi": {"title": "गोपनीयता नीति", "pageTitle": "गोपनीयता नीति — तुर्की शब्दकोश", "metaApp": "ऐप", "metaPackage": "पैकेज नाम", "metaDeveloper": "डेवलपर", "metaUpdated": "अंतिम अपडेट", "updatedDate": "7 अगस्त 2026", "langLabel": "भाषा", "intro": "यह गोपनीयता नीति बताती है कि Google Play पर उपलब्ध <strong>तुर्की शब्दकोश</strong> ऐप उपयोगकर्ता डेटा को कैसे संभालता है। ऐप डाउनलोड या उपयोग करके आप इस नीति से सहमत होते हैं।", "sections": [{"title": "1. डेटा नियंत्रक और संपर्क", "paragraphs": ["डेटा नियंत्रक / डेवलपर: ThunderCraft<br>ईमेल: <a href=\"mailto:hayhak1@gmail.com\">hayhak1@gmail.com</a>", "गोपनीयता संबंधी प्रश्नों के लिए उपरोक्त ईमेल पते पर हमसे संपर्क करें।"]}, {"title": "2. एकत्रित डेटा", "paragraphs": ["ऐप को खाता बनाने, साइन-इन या पंजीकरण की आवश्यकता नहीं है। हम जानबूझकर नाम, ईमेल, फ़ोन नंबर, सटीक स्थान या पहचान दस्तावेज़ जैसे व्यक्तिगत पहचानकर्ता एकत्र नहीं करते और उन्हें अपने सर्वर पर नहीं भेजते। ऐप का अपना उपयोगकर्ता खाता या बैकएंड सर्वर नहीं है।"]}, {"title": "3. आपके डिवाइस पर स्थानीय रूप से संग्रहीत डेटा", "paragraphs": ["निम्नलिखित डेटा केवल आपके डिवाइस पर (स्थानीय संग्रहण / डेटाबेस) संग्रहीत होता है और आपके डिवाइस से निर्यात नहीं होता:", "जब आप ऐप अनइंस्टॉल करते हैं, तो यह स्थानीय डेटा आपके डिवाइस से हटा दिया जाता है।"], "items": ["पसंदीदा शब्द", "खोज इतिहास", "उपयोगकर्ता द्वारा जोड़े गए शब्द / पर्याय", "ऐप में आंकड़े (जैसे साप्ताहिक गतिविधि, स्ट्रीक)", "थीम और शब्दकोश मोड जैसी सेटिंग"]}, {"title": "4. इंटरनेट पर संसाधित डेटा", "paragraphs": ["ऐप इंटरनेट कनेक्शन का उपयोग कर सकता है। जब स्थानीय शब्दकोश में कोई शब्द नहीं मिलता, तो परिभाषा प्राप्त करने के लिए खोजा गया <strong>शब्द पाठ</strong> <a href=\"https://sozluk.gov.tr\" rel=\"noopener noreferrer\">sozluk.gov.tr</a> (तुर्क भाषा संघ Güncel Türkçe Sözlük) पर भेजा जा सकता है।", "यदि आपके डिवाइस में इंटरनेट कनेक्शन नहीं है या TDK जवाब नहीं देता, तो ऑनलाइन परिणाम नहीं दिखाया जाता; स्थानीय शब्दकोश सुविधाएँ काम करती रहती हैं।"], "items": ["भेजा गया डेटा: केवल खोज बॉक्स में टाइप किया गया शब्द", "उद्देश्य: शब्दकोश अर्थ / परिभाषा दिखाना", "कोई व्यक्तिगत पहचान जानकारी नहीं भेजी जाती", "यह अनुरोध TDK की सार्वजनिक वेबसाइट पर किया जाता है; ऐप TDK के साथ आधिकारिक साझेदारी में नहीं है"]}, {"title": "5. अनुमतियाँ", "paragraphs": [], "items": ["<strong>इंटरनेट (INTERNET):</strong> स्थानीय रूप से नहीं मिले शब्दों के लिए TDK शब्दकोश पूछताछ के लिए उपयोग किया जाता है।", "<strong>सूचनाएँ (POST_NOTIFICATIONS):</strong> वैकल्पिक। “दिन का शब्द” सूचना दिखाने के लिए अनुरोध किया जाता है। डिवाइस सेटिंग में अक्षम किया जा सकता है।", "<strong>वॉयस सर्च / माइक्रोफ़ोन:</strong> माइक्रोफ़ोन आइकन पर टैप करने पर आपके डिवाइस की स्पीच रिकग्निशन सेवा (जैसे Google) खुल सकती है। हम ऑडियो रिकॉर्डिंग संग्रहीत नहीं करते; केवल पहचाना गया टेक्स्ट खोज बॉक्स में रखा जाता है।"]}, {"title": "6. तृतीय पक्ष", "paragraphs": ["ऐप निम्नलिखित तृतीय-पक्ष सेवाओं के साथ interact कर सकता है:", "हम विज्ञापन SDK, एналिटिक्स SDK या उपयोगकर्ता ट्रैकिंग टूल का उपयोग नहीं करते।"], "items": ["<strong>Google Play / Play Store:</strong> ऐप वितरण और “हमें रेट करें” के माध्यम से Play Store पेज खोलना। यह प्रक्रिया Google द्वारा प्रबंधित है।", "<strong>sozluk.gov.tr (TDK):</strong> स्थानीय रूप से नहीं मिले शब्दों के लिए परिभाषा खोज। केवल खोजा गया शब्द प्रेषित होता है।", "<strong>डिवाइस स्पीच रिकग्निशन सेवा:</strong> जब उपयोगकर्ता वॉयस सर्च शुरू करता है।"]}, {"title": "7. डेटा साझाकरण और बिक्री", "paragraphs": ["हम उपयोगकर्ता डेटा नहीं बेचते। हम अपने सर्वर पर उपयोगकर्ता प्रोफ़ाइल नहीं बनाते। अनुभाग 4 में वर्णित अनुसार, केवल खोजा गया शब्द शब्दकोश खोज के लिए TDK वेबसाइट पर भेजा जा सकता है।"]}, {"title": "8. डेटा सुरक्षा", "paragraphs": ["स्थानीय डेटा आपके डिवाइस पर रहता है। ऑनलाइन शब्दकोश पूछताछ HTTPS पर की जाती हैं। कोई सुरक्षा उपाय पूर्ण नहीं है; हम अपने डिवाइस को अद्यतन रखने की सलाह देते हैं।"]}, {"title": "9. बच्चों की गोपनीयता", "paragraphs": ["ऐप एक सामान्य भाषा सीखने / शब्दकोश ऐप है। हम जानबूझकर 13 वर्ष से कम उम्र के बच्चों से व्यक्तिगत डेटा एकत्र नहीं करते। माता-पिता को अपने बच्चों के ऐप उपयोग की देखरेख करनी चाहिए।"]}, {"title": "10. आपके अधिकार", "paragraphs": ["आप ऐप में स्थानीय डेटा (जैसे पसंदीदा हटाकर) या ऐप अनइंस्टॉल करके हटा सकते हैं। ऑनलाइन पूछताछ के बारे में प्रश्नों के लिए <a href=\"mailto:hayhak1@gmail.com\">hayhak1@gmail.com</a> पर लिखें।"]}, {"title": "11. इस नीति में परिवर्तन", "paragraphs": ["यह नीति समय-समय पर अपडेट की जा सकती है। वर्तमान संस्करण इस पृष्ठ पर प्रकाशित है। महत्वपूर्ण परिवर्तनों के लिए “अंतिम अपडेट” तिथि संशोधित की जाती है।"]}, {"title": "12. संपर्क", "paragraphs": ["गोपनीयता नीति और डेटा प्रसंस्करण के लिए: <a href=\"mailto:hayhak1@gmail.com\">hayhak1@gmail.com</a>"]}], "footer": "© 2026 तुर्की शब्दकोश · com.hayhak.turkcesozluk"}, "id": {"title": "Kebijakan privasi", "pageTitle": "Kebijakan privasi — Kamus Turki", "metaApp": "Aplikasi", "metaPackage": "nama paket", "metaDeveloper": "Pengembang", "metaUpdated": "Terakhir diperbarui", "updatedDate": "7 Agustus 2026", "langLabel": "Bahasa", "intro": "Kebijakan privasi ini menjelaskan bagaimana aplikasi <strong>Kamus Turki</strong> yang tersedia di Google Play menangani data pengguna. Dengan mengunduh atau menggunakan aplikasi, Anda setuju dengan kebijakan ini.", "sections": [{"title": "1. Pengendali data dan kontak", "paragraphs": ["Pengendali data / Pengembang: ThunderCraft<br>Email: <a href=\"mailto:hayhak1@gmail.com\">hayhak1@gmail.com</a>", "Untuk pertanyaan terkait privasi, hubungi kami di alamat email di atas."]}, {"title": "2. Data yang dikumpulkan", "paragraphs": ["Aplikasi tidak memerlukan pembuatan akun, masuk, atau pendaftaran. Kami tidak dengan sengaja mengumpulkan pengenal pribadi seperti nama, email, nomor telepon, lokasi presisi, atau dokumen identitas, dan tidak mengirimkannya ke server kami. Aplikasi tidak memiliki akun pengguna atau server backend sendiri."]}, {"title": "3. Data yang disimpan secara lokal di perangkat Anda", "paragraphs": ["Data berikut disimpan hanya di perangkat Anda (penyimpanan lokal / basis data) dan tidak diekspor dari perangkat:", "Saat Anda menghapus aplikasi, data lokal ini dihapus dari perangkat Anda."], "items": ["Kata favorit", "Riwayat pencarian", "Kata / sinonim yang ditambahkan pengguna", "Statistik dalam aplikasi (mis. aktivitas mingguan, streak)", "Pengaturan seperti tema dan mode kamus"]}, {"title": "4. Data yang diproses melalui Internet", "paragraphs": ["Aplikasi dapat menggunakan koneksi internet. Ketika kata tidak ditemukan dalam kamus lokal, <strong>teks kata</strong> yang dicari dapat dikirim ke <a href=\"https://sozluk.gov.tr\" rel=\"noopener noreferrer\">sozluk.gov.tr</a> (Asosiasi Bahasa Turki Güncel Türkçe Sözlük)", "Jika perangkat Anda tidak memiliki koneksi internet atau TDK tidak merespons, hasil online tidak ditampilkan; fitur kamus lokal tetap berfungsi."], "items": ["Data yang dikirim: hanya kata yang diketik di kotak pencarian", "Tujuan: menampilkan arti / definisi kamus", "Tidak ada informasi identitas pribadi yang dikirim", "Permintaan ini dibuat ke situs web publik TDK; aplikasi tidak bekerja sama resmi dengan TDK"]}, {"title": "5. Izin", "paragraphs": [], "items": ["<strong>Internet (INTERNET):</strong> Digunakan untuk menanyakan kamus TDK untuk kata yang tidak ditemukan secara lokal.", "<strong>Notifikasi (POST_NOTIFICATIONS):</strong> Opsional. Diminta untuk menampilkan notifikasi “Kata hari ini”. Dapat dinonaktifkan di pengaturan perangkat.", "<strong>Pencarian suara / mikrofon:</strong> Saat Anda mengetuk ikon mikrofon, layanan pengenalan suara perangkat (mis. Google) dapat terbuka. Kami tidak menyimpan rekaman audio; hanya teks yang dikenali yang dimasukkan ke kotak pencarian."]}, {"title": "6. Pihak ketiga", "paragraphs": ["Aplikasi dapat berinteraksi dengan layanan pihak ketiga berikut:", "Kami tidak menggunakan SDK iklan, SDK analitik, atau alat pelacakan pengguna."], "items": ["<strong>Google Play / Play Store:</strong> Distribusi aplikasi dan membuka halaman Play Store melalui “Beri kami rating”. Proses ini dikelola oleh Google.", "<strong>sozluk.gov.tr (TDK):</strong> Pencarian definisi untuk kata yang tidak ditemukan secara lokal. Hanya kata yang dicari yang dikirim.", "<strong>Layanan pengenalan suara perangkat:</strong> Saat pengguna memulai pencarian suara."]}, {"title": "7. Berbagi dan penjualan data", "paragraphs": ["Kami tidak menjual data pengguna. Kami tidak membuat profil pengguna di server kami. Seperti dijelaskan di Bagian 4, hanya kata yang dicari yang dapat dikirim ke situs TDK untuk pencarian kamus."]}, {"title": "8. Keamanan data", "paragraphs": ["Data lokal tetap di perangkat Anda. Kueri kamus online dilakukan melalui HTTPS. Tidak ada langkah keamanan yang mutlak; kami menyarankan menjaga perangkat Anda tetap diperbarui."]}, {"title": "9. Privasi anak", "paragraphs": ["Aplikasi ini adalah aplikasi pembelajaran bahasa / kamus umum. Kami tidak dengan sengaja mengumpulkan data pribadi dari anak di bawah 13 tahun. Orang tua harus mengawasi penggunaan aplikasi oleh anak-anak mereka."]}, {"title": "10. Hak Anda", "paragraphs": ["Anda dapat menghapus data lokal di aplikasi (mis. dengan menghapus favorit) atau dengan menghapus aplikasi. Untuk pertanyaan tentang kueri online, tulis ke <a href=\"mailto:hayhak1@gmail.com\">hayhak1@gmail.com</a>."]}, {"title": "11. Perubahan kebijakan ini", "paragraphs": ["Kebijakan ini dapat diperbarui dari waktu ke waktu. Versi saat ini dipublikasikan di halaman ini. Tanggal “Terakhir diperbarui” direvisi untuk perubahan signifikan."]}, {"title": "12. Kontak", "paragraphs": ["Untuk kebijakan privasi dan pemrosesan data: <a href=\"mailto:hayhak1@gmail.com\">hayhak1@gmail.com</a>"]}], "footer": "© 2026 Kamus Turki · com.hayhak.turkcesozluk"}, "ja": {"title": "プライバシーポリシー", "pageTitle": "プライバシーポリシー — トルコ語辞書", "metaApp": "アプリ", "metaPackage": "パッケージ名", "metaDeveloper": "開発者", "metaUpdated": "最終更新", "updatedDate": "2026年8月7日", "langLabel": "言語", "intro": "本プライバシーポリシーは、Google Playで提供される<strong>トルコ語辞書</strong>アプリがユーザーデータをどのように取り扱うかを説明します。アプリをダウンロードまたは使用することで、本ポリシーに同意したものとみなされます。", "sections": [{"title": "1. データ管理者と連絡先", "paragraphs": ["データ管理者 / 開発者：ThunderCraft<br>メール：<a href=\"mailto:hayhak1@gmail.com\">hayhak1@gmail.com</a>", "プライバシーに関するご質問は、上記のメールアドレスまでお問い合わせください。"]}, {"title": "2. 収集するデータ", "paragraphs": ["本アプリはアカウント作成、サインイン、登録を必要としません。氏名、メール、電話番号、正確な位置情報、身分証明書などの個人識別情報を故意に収集せず、自社サーバーにも送信しません。本アプリには独自のユーザーアカウントやバックエンドサーバーはありません。"]}, {"title": "3. デバイスにローカル保存されるデータ", "paragraphs": ["以下のデータはお使いのデバイス（ローカルストレージ / データベース）にのみ保存され、デバイス外にエクスポートされません：", "アプリをアンインストールすると、これらのローカルデータもデバイスから削除されます。"], "items": ["お気に入りの単語", "検索履歴", "ユーザーが追加した単語 / 同義語", "アプリ内統計（例：週間アクティビティ、連続記録）", "テーマや辞書モードなどの設定"]}, {"title": "4. インターネット経由で処理されるデータ", "paragraphs": ["本アプリはインターネット接続を使用する場合があります。ローカル辞書で単語が見つからない場合、定義を取得するために検索した<strong>単語テキスト</strong>が <a href=\"https://sozluk.gov.tr\" rel=\"noopener noreferrer\">sozluk.gov.tr</a>（トルコ言語協会 Güncel Türkçe Sözlük）に送信されることがあります。", "デバイスにインターネット接続がない場合、または TDK が応答しない場合、オンライン結果は表示されません。ローカル辞書機能は引き続き動作します。"], "items": ["送信データ：検索ボックスに入力された単語のみ", "目的：辞書の意味 / 定義情報を表示する", "個人識別情報は送信されません", "このリクエストは TDK の公開サイトに行われます。本アプリは TDK と公式提携していません"]}, {"title": "5. 権限", "paragraphs": [], "items": ["<strong>インターネット (INTERNET)：</strong>ローカルで見つからない単語の TDK 辞書照会に使用します。", "<strong>通知 (POST_NOTIFICATIONS)：</strong>任意。「今日の単語」通知を表示するために要求されます。デバイス設定で無効にできます。", "<strong>音声検索 / マイク：</strong>マイクアイコンをタップすると、デバイスの音声認識サービス（例：Google）が開く場合があります。音声録音は保存せず、認識されたテキストのみ検索ボックスに入力されます。"]}, {"title": "6. 第三者", "paragraphs": ["本アプリは以下の第三者サービスと連携する場合があります：", "広告 SDK、分析 SDK、ユーザートラッキングツールは使用しません。"], "items": ["<strong>Google Play / Play Store：</strong>アプリの配布および「評価する」から Play Store ページを開くため。これは Google によって管理されます。", "<strong>sozluk.gov.tr (TDK)：</strong>ローカルで見つからない単語の定義照会。検索した単語のみ送信されます。", "<strong>デバイスの音声認識サービス：</strong>ユーザーが音声検索を開始したとき。"]}, {"title": "7. データの共有と販売", "paragraphs": ["ユーザーデータを販売しません。自社サーバーでユーザープロフィールを作成しません。第 4 節で説明したとおり、辞書照会のために検索した単語のみ TDK サイトに送信される場合があります。"]}, {"title": "8. データセキュリティ", "paragraphs": ["ローカルデータはデバイス上に保持されます。オンライン辞書照会は HTTPS 経由で行われます。セキュリティ対策は絶対ではありません。デバイスを最新の状態に保つことをお勧めします。"]}, {"title": "9. 子どものプライバシー", "paragraphs": ["本アプリは一般的な語学学習 / 辞書アプリです。13 歳未満の子どもから故意に個人データを収集しません。保護者は子どものアプリ利用を監督してください。"]}, {"title": "10. お客様の権利", "paragraphs": ["アプリ内（お気に入りの削除など）またはアプリのアンインストールでローカルデータを削除できます。オンライン照会に関するご質問は <a href=\"mailto:hayhak1@gmail.com\">hayhak1@gmail.com</a> までご連絡ください。"]}, {"title": "11. 本ポリシーの変更", "paragraphs": ["本ポリシーは随時更新される場合があります。最新版はこのページで公開されます。重要な変更がある場合、「最終更新」日が改訂されます。"]}, {"title": "12. お問い合わせ", "paragraphs": ["プライバシーポリシーおよびデータ処理について：<a href=\"mailto:hayhak1@gmail.com\">hayhak1@gmail.com</a>"]}], "footer": "© 2026 トルコ語辞書 · com.hayhak.turkcesozluk"}, "kk": {"title": "Құпиялылық саясаты", "pageTitle": "Құпиялылық саясаты — Түркше сөздік", "metaApp": "Қолданба", "metaPackage": "пакет атауы", "metaDeveloper": "Әзірлеуші", "metaUpdated": "Соңғы жаңарту", "updatedDate": "2026 ж. 7 тамыз", "langLabel": "Тіл", "intro": "Бұл құпиялылық саясаты Google Play арқылы ұсынылған <strong>Түркше сөздік</strong> қолданбасының пайдаланушы деректерін қалай өңдейтінін түсіндіреді. Қолданбаны жүктеп алу немесе пайдалану арқылы сіз осы саясатқа келісесіз.", "sections": [{"title": "1. Деректер менеджері және байланыс", "paragraphs": ["Деректер менеджері / Әзірлеуші: ThunderCraft<br>Электрондық пошта: <a href=\"mailto:hayhak1@gmail.com\">hayhak1@gmail.com</a>", "Құпиялылыққа қатысты сұрақтар үшін жоғарыдағы электрондық пошта арқылы бізбен хабарласа аласыз."]}, {"title": "2. Жиналатын деректер", "paragraphs": ["Қолданба тіркелгі жасауды, кіруді немесе тіркеуді талап етпейді. Біз аты, электрондық пошта, телефон нөмірі, нақты орналасу немесе куәлік сияқты жеке сәйкестендіру деректерін саналы түрде жинамаймыз және оларды өз серверлерімізге жібермейміз. Қолданбanın өз пайдаланушы тіркелгісі немесе backend сервері жоқ."]}, {"title": "3. Құрылғыда жергілікті сақталатын деректер", "paragraphs": ["Келесі деректер тек сіздің құрылғыңызда (жергілікті сақтау / дерекқор) сақталады және құрылғыдан экспортталмайды:", "Қолданбаны жойғанда бұл жергілікті деректер де құрылғыдан жойылады."], "items": ["Таңдаулы сөздер", "Іздеу тарихы", "Пайдаланушы қосқан сөздер / синонимдер", "Қолданба ішіндегі статистика (мыс. апталық белсенділік, серия)", "Тема және сөздік режимі сияқты параметрлер"]}, {"title": "4. Интернет арқылы өңделетін деректер", "paragraphs": ["Қолданба интернет байланысын пайдалана алады. Жергілікті сөздікте сөз табылмағанда, мағына алу үшін ізделген <strong>сөз мәтіні</strong> <a href=\"https://sozluk.gov.tr\" rel=\"noopener noreferrer\">sozluk.gov.tr</a> (Түрк тілінің қауымдастығы Güncel Türkçe Sözlük) сайтына жіберілуі мүмкін.", "Құрылғыда интернет байланысы болмаса немесе TDK жауап бермесе, онлайн нәтиже көрсетілмейді; жергілікті сөздік функциялары жұмысын жалғастырады."], "items": ["Жіберілетін дерек: тек іздеу өрісіне жазылған сөз", "Мақсат: сөздік мағынасы / анықтаманы көрсету", "Жеке сәйкестендіру деректері жіберілмейді", "Бұл сұрау TDK-ның ашық сайтына жіберіледі; қолданба TDK-мен ресми әріптес емес"]}, {"title": "5. Рұқсаттар", "paragraphs": [], "items": ["<strong>Интернет (INTERNET):</strong> Жергілікті табылмаған сөздер үшін TDK сөздік сұрауын орындау үшін пайдаланылады.", "<strong>Хабарландырулар (POST_NOTIFICATIONS):</strong> Қосымша. «Күннің сөзі» хабарландыруын көрсету үшін сұралады. Құрылғы параметрлерінен өшірілуі мүмкін.", "<strong>Дауыспен іздеу / микрофон:</strong> Микрофон белгішесін басқанда құрылғының дауыс тану қызметі (мыс. Google) ашылуы мүмкін. Біз аудио жазбаларды сақтамаймыз; тек танылған мәтін іздеу өрісіне жазылады."]}, {"title": "6. Үшінші тараптар", "paragraphs": ["Қолданба келесі үшінші тарап қызметтерімен өзара әрекеттесуі мүмкін:", "Біз жарнама SDK, аналитика SDK немесе пайдаланушы бақылау құралдарын пайдаланбаймыз."], "items": ["<strong>Google Play / Play Store:</strong> Қолданбаны тарату және «Бізді бағалаңыз» арқылы Play Store бетін ашу үшін. Бұл процесті Google басқарады.", "<strong>sozluk.gov.tr (TDK):</strong> Жергілікті табылмаған сөздер үшін мағына сұрауы. Тек ізделген сөз жіберіледі.", "<strong>Құрылғы дауыс тану қызметі:</strong> Пайдаланушы дауыспен іздеуді бастағанда."]}, {"title": "7. Деректерді бөлісу және сату", "paragraphs": ["Біз пайдаланушы деректерін сатпаймыз. Өз серверлерімізде пайдаланушы профилін жасамаймыз. 4-бөлімде сипатталғандай, тек сөздік сұрауы үшін ізделген сөз TDK сайтына жіберілуі мүмкін."]}, {"title": "8. Деректер қауіпсіздігі", "paragraphs": ["Жергілікті деректер құрылғыңызда сақталады. Онлайн сөздік сұраулары HTTPS арқылы орындалады. Ешбір қауіпсіздік шарасы абсолютті емес; құрылғыңызды жаңартылған күйде ұстауды ұсынамыз."]}, {"title": "9. Балалардың құпиялылығы", "paragraphs": ["Қолданба — жалпы тіл үйрену / сөздік қолданбасы. 13 жасқа дейінгі балалардан саналы түрде жеке деректер жинамаймыз. Ата-аналар балаларының қолданбаны пайдалануын бақылауы керек."]}, {"title": "10. Сіздің құқықтарыңыз", "paragraphs": ["Жергілікті деректерді қолданба ішінде (мыс. таңдаулыларды жою арқылы) немесе қолданбаны жойу арқылы жоя аласыз. Онлайн сұраулар бойынша сұрақтар үшін <a href=\"mailto:hayhak1@gmail.com\">hayhak1@gmail.com</a> адресіне жазыңыз."]}, {"title": "11. Саясаттағы өзгерістер", "paragraphs": ["Бұл саясат уақыт өте келе жаңартылуы мүмкін. Ағымдағы нұсқа осы бетте жарияланады. Маңызды өзгерістерде «Соңғы жаңарту» күні жаңартылады."]}, {"title": "12. Байланыс", "paragraphs": ["Құпиялылық саясаты және деректерді өңдеу туралы: <a href=\"mailto:hayhak1@gmail.com\">hayhak1@gmail.com</a>"]}], "footer": "© 2026 Түркше сөздік · com.hayhak.turkcesozluk"}, "ko": {"title": "개인정보 처리방침", "pageTitle": "개인정보 처리방침 — 터키어 사전", "metaApp": "앱", "metaPackage": "패키지 이름", "metaDeveloper": "개발자", "metaUpdated": "최종 업데이트", "updatedDate": "2026년 8월 7일", "langLabel": "언어", "intro": "본 개인정보 처리방침은 Google Play에서 제공되는 <strong>터키어 사전</strong> 앱이 사용자 데이터를 어떻게 처리하는지 설명합니다. 앱을 다운로드하거나 사용함으로써 본 방침에 동의하게 됩니다.", "sections": [{"title": "1. 데이터 관리자 및 연락처", "paragraphs": ["데이터 관리자 / 개발자: ThunderCraft<br>이메일: <a href=\"mailto:hayhak1@gmail.com\">hayhak1@gmail.com</a>", "개인정보 관련 문의는 위 이메일 주소로 연락해 주세요."]}, {"title": "2. 수집되는 데이터", "paragraphs": ["앱은 계정 생성, 로그인 또는 등록을 요구하지 않습니다. 이름, 이메일, 전화번호, 정확한 위치 또는 신분증과 같은 개인 식별 정보를 고의로 수집하지 않으며 자사 서버로 전송하지 않습니다. 앱에는 자체 사용자 계정이나 백엔드 서버가 없습니다."]}, {"title": "3. 기기에 로컬로 저장되는 데이터", "paragraphs": ["다음 데이터는 사용자 기기(로컬 저장소 / 데이터베이스)에만 저장되며 기기 외부로 내보내지지 않습니다:", "앱을 삭제하면 이 로컬 데이터도 기기에서 제거됩니다."], "items": ["즐겨찾는 단어", "검색 기록", "사용자가 추가한 단어 / 동의어", "앱 내 통계(예: 주간 활동, 연속 기록)", "테마 및 사전 모드 등 설정"]}, {"title": "4. 인터넷을 통해 처리되는 데이터", "paragraphs": ["앱은 인터넷 연결을 사용할 수 있습니다. 로컬 사전에서 단어를 찾을 수 없을 때, 정의를 가져오기 위해 검색한 <strong>단어 텍스트</strong>가 <a href=\"https://sozluk.gov.tr\" rel=\"noopener noreferrer\">sozluk.gov.tr</a>(터키어 협회 Güncel Türkçe Sözlük)로 전송될 수 있습니다.", "기기에 인터넷 연결이 없거나 TDK가 응답하지 않으면 온라인 결과가 표시되지 않으며 로컬 사전 기능은 계속 작동합니다."], "items": ["전송 데이터: 검색창에 입력된 단어만", "목적: 사전 의미 / 정의 정보 표시", "개인 신원 정보는 전송되지 않음", "이 요청은 TDK 공개 웹사이트로 이루어지며 앱은 TDK와 공식 파트너십 관계가 아닙니다"]}, {"title": "5. 권한", "paragraphs": [], "items": ["<strong>인터넷 (INTERNET):</strong> 로컬에서 찾을 수 없는 단어에 대한 TDK 사전 조회에 사용됩니다.", "<strong>알림 (POST_NOTIFICATIONS):</strong> 선택 사항. “오늘의 단어” 알림 표시를 위해 요청됩니다. 기기 설정에서 비활성화할 수 있습니다.", "<strong>음성 검색 / 마이크:</strong> 마이크 아이콘을 탭하면 기기의 음성 인식 서비스(예: Google)가 열릴 수 있습니다. 오디오 녹음은 저장하지 않으며 인식된 텍스트만 검색창에 입력됩니다."]}, {"title": "6. 제3자", "paragraphs": ["앱은 다음 제3자 서비스와 상호작용할 수 있습니다:", "광고 SDK, 분석 SDK 또는 사용자 추적 도구를 사용하지 않습니다."], "items": ["<strong>Google Play / Play Store:</strong> 앱 배포 및 “평가하기”를 통한 Play Store 페이지 열기. 이 과정은 Google에서 관리합니다.", "<strong>sozluk.gov.tr (TDK):</strong> 로컬에서 찾을 수 없는 단어의 정의 조회. 검색한 단어만 전송됩니다.", "<strong>기기 음성 인식 서비스:</strong> 사용자가 음성 검색을 시작할 때."]}, {"title": "7. 데이터 공유 및 판매", "paragraphs": ["사용자 데이터를 판매하지 않습니다. 자사 서버에서 사용자 프로필을 생성하지 않습니다. 제4조에서 설명한 대로 사전 조회를 위해 검색한 단어만 TDK 웹사이트로 전송될 수 있습니다."]}, {"title": "8. 데이터 보안", "paragraphs": ["로컬 데이터는 기기에 유지됩니다. 온라인 사전 조회는 HTTPS를 통해 이루어집니다. 어떤 보안 조치도 절대적이지 않으며 기기를 최신 상태로 유지할 것을 권장합니다."]}, {"title": "9. 아동 개인정보", "paragraphs": ["앱은 일반적인 언어 학습 / 사전 앱입니다. 13세 미만 아동의 개인 데이터를 고의로 수집하지 않습니다. 부모는 자녀의 앱 사용을 감독해야 합니다."]}, {"title": "10. 귀하의 권리", "paragraphs": ["앱에서 로컬 데이터(예: 즐겨찾기 제거)를 삭제하거나 앱을 삭제하여 제거할 수 있습니다. 온라인 조회에 관한 문의는 <a href=\"mailto:hayhak1@gmail.com\">hayhak1@gmail.com</a>로 작성해 주세요."]}, {"title": "11. 본 방침의 변경", "paragraphs": ["본 방침은 수시로 업데이트될 수 있습니다. 현재 버전은 이 페이지에 게시됩니다. 중요한 변경 시 “최종 업데이트” 날짜가 수정됩니다."]}, {"title": "12. 연락처", "paragraphs": ["개인정보 처리방침 및 데이터 처리 관련: <a href=\"mailto:hayhak1@gmail.com\">hayhak1@gmail.com</a>"]}], "footer": "© 2026 터키어 사전 · com.hayhak.turkcesozluk"}, "ky": {"title": "Купуялык саясаты", "pageTitle": "Купуялык саясаты — Түркчө сөздүк", "metaApp": "Колдонмо", "metaPackage": "пакет аты", "metaDeveloper": "Иштеп чыгуучу", "metaUpdated": "Акыркы жаңылоо", "updatedDate": "2026-ж. 7-август", "langLabel": "Тил", "intro": "Бул купуялык саясаты Google Play аркылуу сунушталган <strong>Түркчө сөздүк</strong> колдонмосунун колдонуучу маалыматтарын кантип иштеп чыгарганын түшүндүрөт. Колдонмону жүктөп алуу же колдонуу аркылуу сиз бул саясатка макулсуз.", "sections": [{"title": "1. Маалыматтарды башкаруучу жана байланыш", "paragraphs": ["Маалыматтарды башкаруучу / Иштеп чыгуучу: ThunderCraft<br>Электрондук почта: <a href=\"mailto:hayhak1@gmail.com\">hayhak1@gmail.com</a>", "Купуялык боюнча суроолор үчүн жогорудагы электрондук почта аркылуу биз менен байланышыңыз."]}, {"title": "2. Чогултулган маалыматтар", "paragraphs": ["Колдонмо аккаунт түзүүнү, кирууну же катталууну талап кылбайт. Биз ат, электрондук почта, телефон номери, так жайгашуу же кимдик документтер сыяктуу жеке идентификация маалыматтарын атайын чогултпайбыз жана аларды өз серверлерибизге жибербейбиз. Колдонмонун өз колдонуучу аккаунту же backend сервери жок."]}, {"title": "3. Түзмөктө жергиликтүү сакталган маалыматтар", "paragraphs": ["Төмөнкү маалыматтар тек сиздин түзмөгүңүздө (жергиликтүү сактоо / маалымат базасы) сакталат жана түзмөктөн экспорттолбойт:", "Колдонмону өчүргөндө бул жергиликтүү маалыматтар да түзмөктөн өчүрүлөт."], "items": ["Тандалган сөздөр", "Издөө тарыхы", "Колдонуучу кошкон сөздөр / синонимдер", "Колдонмо ичиндеги статистика (мис. жумалык активдүүлүк, серия)", "Тема жана сөздүк режими сыяктуу параметрлер"]}, {"title": "4. Интернет аркылуу иштелген маалыматтар", "paragraphs": ["Колдонмо интернет байланышын колдонушу мүмкүн. Жергиликтүү сөздүктө сөз табылбаса, маанисин алуу үчүн изделген <strong>сөз тексти</strong> <a href=\"https://sozluk.gov.tr\" rel=\"noopener noreferrer\">sozluk.gov.tr</a> (Түрк тилинин коому Güncel Türkçe Sözlük) сайтына жиберилиши мүмкүн.", "Түзмөктө интернет байланышы жок болсо же TDK жооп бербесе, онлайн натыйжа көрсөтүлбөйт; жергиликтүү сөздүк функциялары иштеп турат."], "items": ["Жиберилген маалымат: издөө талаасына жазылган сөз гана", "Максат: сөздүк маанисин / аныктамасын көрсөтүү", "Жеке идентификация маалыматтары жиберилбейт", "Бул суроо TDKнын ачык сайтына жиберилет; колдонмо TDK менен расмiy өнөктөш эмес"]}, {"title": "5. Уруксаттар", "paragraphs": [], "items": ["<strong>Интернет (INTERNET):</strong> Жергиликтүү табылбаган сөздөр үчүн TDK сөздүк суроосун аткаруу үчүн колдонулат.", "<strong>Эскертмелер (POST_NOTIFICATIONS):</strong> Милдеттүү эмес. «Күнүн сөзү» эскертмесин көрсөтүү үчүн суралат. Түзмөк параметрлеринен өчүрүлүлүшү мүмкүн.", "<strong>Үн менен издөө / микрофон:</strong> Микрофон белгисине басканда түзмөктүн үн таануу кызматы (мис. Google) ачылышы мүмкүн. Биз аудио жазууларды сактабайбыз; таанылган текст гана издөө талаасына жазылат."]}, {"title": "6. Үчүнчү тараптар", "paragraphs": ["Колдонмо төмөнкү үчүнчү тарап кызматтары менен өз ара аракеттеши мүмкүн:", "Биз жарнама SDK, аналитика SDK же колдонуучуну бакылоо куралдарын колдонбойбуз."], "items": ["<strong>Google Play / Play Store:</strong> Колдонмону таратуу жана «Бизди баалаңыз» аркылуу Play Store бетин ачуу үчүн. Бул процессти Google башкарат.", "<strong>sozluk.gov.tr (TDK):</strong> Жергиликтүү табылбаган сөздөр үчүн маани суроосу. Изделген сөз гана жиберилет.", "<strong>Түзмөктүн үн таануу кызматы:</strong> Колдонуучу үн менен издөөнү баштаганда."]}, {"title": "7. Маалыматтарды бөлүшүү жана сатуу", "paragraphs": ["Биз колдонуучу маалыматтарын сатпайбыз. Өз серверлерибизде колдонуучу профилин түзбөйбүз. 4-бөлүмдө сүрөттөлгөндөй, сөздүк суроосу үчүн гана изделген сөз TDK сайтына жиберилиши мүмкүн."]}, {"title": "8. Маалымат коопсуздугу", "paragraphs": ["Жергиликтүү маалыматтар түзмөгүңүздө сакталат. Онлайн сөздүк суроолору HTTPS аркылуу аткарылат. Эч кандай коопсуздук чарасы абсолюттуу эмес; түзмөгүңүздү жаңыланган күйдө кармоону сунуштайбыз."]}, {"title": "9. Балдардын купуялыгы", "paragraphs": ["Колдонмо — жалпы тил үйрөнүү / сөздүк колдонмосу. 13 жашка чейинки балдардан атайын жеке маалымат чогултпайбыз. Ата-энелер балдардын колдонмону колдонушун көзөмөлдөшү керек."]}, {"title": "10. Сиздин укуктарыңыз", "paragraphs": ["Жергиликтүү маалыматтарды колдонмо ичинде (мис. тандалгандардын жок кылуу) же колдонмону өчүрүү аркылуу жок кыла аласыз. Онлайн суроолор боюнча суроолор үчүн <a href=\"mailto:hayhak1@gmail.com\">hayhak1@gmail.com</a> дарегине жазыңыз."]}, {"title": "11. Саясаттагы өзгөрүүлөр", "paragraphs": ["Бул саясат убакыт өткөндө жаңыртылышы мүмкүн. Учурдагы версия бул баракчада жарыяланат. Маанилүү өзгөрүүлөрдө «Акыркы жаңылоо» датасы жаңыртылат."]}, {"title": "12. Байланыш", "paragraphs": ["Купуялык саясаты жана маалыматтарды иштетүү боюнча: <a href=\"mailto:hayhak1@gmail.com\">hayhak1@gmail.com</a>"]}], "footer": "© 2026 Түркчө сөздүк · com.hayhak.turkcesozluk"}, "mr": {"title": "गोपनीयता धोरण", "pageTitle": "गोपनीयता धोरण — तुर्की शब्दकोश", "metaApp": "अॅप", "metaPackage": "पॅकेज नाव", "metaDeveloper": "विकसक", "metaUpdated": "अंतिम अद्यतन", "updatedDate": "७ ऑगस्ट २०२६", "langLabel": "भाषा", "intro": "ही गोपनीयता धोरण Google Play वर उपलब्ध असलेले <strong>तुर्की शब्दकोश</strong> अॅप वापरकर्त्याचा डेटा कसा हाताळते हे स्पष्ट करते. अॅप डाउनलोड किंवा वापरून आपण या धोरणाशी सहमत आहात.", "sections": [{"title": "1. डेटा नियंत्रक आणि संपर्क", "paragraphs": ["डेटा नियंत्रक / विकसक: ThunderCraft<br>ईमेल: <a href=\"mailto:hayhak1@gmail.com\">hayhak1@gmail.com</a>", "गोपनीयतेशी संबंधित प्रश्नांसाठी वरील ईमेल पत्त्यावर आमच्याशी संपर्क साधा."]}, {"title": "2. गोळा केलेला डेटा", "paragraphs": ["अॅपला खाते तयार करणे, साइन-इन किंवा नोंदणी आवश्यक नाही. आम्ही नाव, ईमेल, फोन नंबर, अचूक स्थान किंवा ओळखपत्रे यासारखे वैयक्तिक ओळखकर्ते जाणूनबुजून गोळा करत नाही आणि ते आमच्या सर्व्हरवर पाठवत नाही. अॅपचे स्वतःचे वापरकर्ता खाते किंवा बॅकएंड सर्व्हर नाही."]}, {"title": "3. तुमच्या डिव्हाइसवर स्थानिकरित्या साठवलेला डेटा", "paragraphs": ["खालील डेटा फक्त तुमच्या डिव्हाइसवर (स्थानिक स्टोरेज / डेटाबेस) साठवला जातो आणि डिव्हाइसमधून निर्यात केला जात नाही:", "तुम्ही अॅप अनइंस्टॉल केल्यावर हा स्थानिक डेटा तुमच्या डिव्हाइसमधून काढला जातो."], "items": ["आवडते शब्द", "शोध इतिहास", "वापरकर्त्याने जोडलेले शब्द / समानार्थी", "अॅपमधील आकडेवारी (उदा. साप्ताहिक क्रियाकलाप, साखळी)", "थीम आणि शब्दकोश मोड सारख्या सेटिंग्ज"]}, {"title": "4. इंटरनेटद्वारे प्रक्रिया केलेला डेटा", "paragraphs": ["अॅप इंटरनेट कनेक्शन वापरू शकते. स्थानिक शब्दकोशात शब्द सापडला नाही तर, व्याख्या मिळवण्यासाठी शोधलेला <strong>शब्द मजकूर</strong> <a href=\"https://sozluk.gov.tr\" rel=\"noopener noreferrer\">sozluk.gov.tr</a> (तुर्की भाषा संस्था Güncel Türkçe Sözlük) वर पाठवला जाऊ शकतो.", "तुमच्या डिव्हाइसवर इंटरनेट कनेक्शन नसेल किंवा TDK प्रतिसाद देऊ नाही तर, ऑनलाइन निकाल दाखवला जात नाही; स्थानिक शब्दकोश वैशिष्ट्ये कार्य करत राहतात."], "items": ["पाठवलेला डेटा: फक्त शोध बॉक्समध्ये टाइप केलेला शब्द", "उद्देश: शब्दकोश अर्थ / व्याख्या दाखवणे", "कोणतीही वैयक्तिक ओळख माहिती पाठवली जात नाही", "ही विनंती TDK च्या सार्वजनिक वेबसाइटवर केली जाते; अॅप TDK शी अधिकृत भागीदारीत नाही"]}, {"title": "5. परवानग्या", "paragraphs": [], "items": ["<strong>इंटरनेट (INTERNET):</strong> स्थानिकरित्या न सापडलेल्या शब्दांसाठी TDK शब्दकोश चौकशीसाठी वापरले.", "<strong>सूचना (POST_NOTIFICATIONS):</strong> ऐच्छिक. “दिवसाचा शब्द” सूचना दाखवण्यासाठी विनंती केली जाते. डिव्हाइस सेटिंग्जमध्ये बंद केले जाऊ शकते.", "<strong>व्हॉइस सर्च / मायक्रोफोन:</strong> मायक्रोफोन चिन्हावर टॅप केल्यावर तुमच्या डिव्हाइसची स्पीच रेकग्निशन सेवा (उदा. Google) उघडू शकते. आम्ही ऑडिओ रेकॉर्डिंग साठवत नाही; फक्त ओळखलेला मजकूर शोध बॉक्समध्ये ठेवला जातो."]}, {"title": "6. तृतीय पक्ष", "paragraphs": ["अॅप खालील तृतीय-पक्ष सेवांशी interact करू शकते:", "आम्ही जाहिरात SDK, विश्लेषण SDK किंवा वापरकर्ता ट्रॅकिंग साधने वापरत नाही."], "items": ["<strong>Google Play / Play Store:</strong> अॅप वितरण आणि “आम्हाला रेट करा” द्वारे Play Store पृष्ठ उघडणे. ही प्रक्रिया Google द्वारे व्यवस्थापित.", "<strong>sozluk.gov.tr (TDK):</strong> स्थानिकरित्या न सापडलेल्या शब्दांच्या व्याख्येची चौकशी. फक्त शोधलेला शब्द पाठवला जातो.", "<strong>डिव्हाइस स्पीच रेकग्निशन सेवा:</strong> वापरकर्ता व्हॉइस सर्च सुरू केल्यावर."]}, {"title": "7. डेटा शेअरिंग आणि विक्री", "paragraphs": ["आम्ही वापरकर्ता डेटा विकत नाही. आमच्या सर्व्हरवर वापरकर्ता प्रोफाइल तयार करत नाही. विभाग 4 मध्ये वर्णन केल्याप्रमाणे, शब्दकोश चौकशीसाठी फक्त शोधलेला शब्द TDK वेबसाइटवर पाठवला जाऊ शकतो."]}, {"title": "8. डेटा सुरक्षा", "paragraphs": ["स्थानिक डेटा तुमच्या डिव्हाइसवर राहतो. ऑनलाइन शब्दकोश चौकश्या HTTPS द्वारे केल्या जातात. कोणतीही सुरक्षा उपाय पूर्ण नाही; डिव्हाइस अद्ययावत ठेवण्याची शिफारस करतो."]}, {"title": "9. मुलांची गोपनीयता", "paragraphs": ["अॅप हे सामान्य भाषा शिकण्याचे / शब्दकोश अॅप आहे. आम्ही 13 वर्षांखालील मुलांकडून जाणूनबुजून वैयक्तिक डेटा गोळा करत नाही. पालकांनी मुलांच्या अॅप वापरावर देखरेख करावी."]}, {"title": "10. तुमचे अधिकार", "paragraphs": ["अॅपमध्ये स्थानिक डेटा (उदा. आवडते काढून) किंवा अॅप अनइंस्टॉल करून हटवू शकता. ऑनलाइन चौकशींबद्दल प्रश्नांसाठी <a href=\"mailto:hayhak1@gmail.com\">hayhak1@gmail.com</a> वर लिहा."]}, {"title": "11. या धोरणातील बदल", "paragraphs": ["हे धोरण वेळोवेळी अद्यतनित केले जाऊ शकते. सध्याची आवृत्ती या पृष्ठावर प्रकाशित केली जाते. महत्त्वपूर्ण बदलांसाठी “अंतिम अद्यतन” तारीख सुधारली जाते."]}, {"title": "12. संपर्क", "paragraphs": ["गोपनीयता धोरण आणि डेटा प्रक्रियेसाठी: <a href=\"mailto:hayhak1@gmail.com\">hayhak1@gmail.com</a>"]}], "footer": "© 2026 तुर्की शब्दकोश · com.hayhak.turkcesozluk"}, "pt": {"title": "Política de privacidade", "pageTitle": "Política de privacidade — Dicionário turco", "metaApp": "Aplicativo", "metaPackage": "nome do pacote", "metaDeveloper": "Desenvolvedor", "metaUpdated": "Última atualização", "updatedDate": "7 de agosto de 2026", "langLabel": "Idioma", "intro": "Esta política de privacidade explica como o aplicativo <strong>Dicionário turco</strong> disponível no Google Play trata os dados do usuário. Ao baixar ou usar o aplicativo, você concorda com esta política.", "sections": [{"title": "1. Controlador de dados e contacto", "paragraphs": ["Controlador de dados / Desenvolvedor: ThunderCraft<br>E-mail: <a href=\"mailto:hayhak1@gmail.com\">hayhak1@gmail.com</a>", "Para questões relacionadas com a privacidade, contacte-nos no endereço de e-mail acima."]}, {"title": "2. Dados recolhidos", "paragraphs": ["A aplicação não requer criação de conta, início de sessão ou registo. Não recolhemos deliberadamente identificadores pessoais como nome, e-mail, número de telefone, localização precisa ou documentos de identidade, nem os enviamos para os nossos servidores. A aplicação não tem conta de utilizador nem servidor backend próprio."]}, {"title": "3. Dados armazenados localmente no seu dispositivo", "paragraphs": ["Os seguintes dados são armazenados apenas no seu dispositivo (armazenamento local / base de dados) e não são exportados do dispositivo:", "Ao desinstalar a aplicação, estes dados locais são removidos do seu dispositivo."], "items": ["Palavras favoritas", "Histórico de pesquisa", "Palavras / sinónimos adicionados pelo utilizador", "Estatísticas na aplicação (p. ex., atividade semanal, sequência)", "Definições como tema e modo de dicionário"]}, {"title": "4. Dados processados pela Internet", "paragraphs": ["A aplicação pode utilizar uma ligação à Internet. Quando uma palavra não é encontrada no dicionário local, o <strong>texto da palavra</strong> pesquisada pode ser enviado para <a href=\"https://sozluk.gov.tr\" rel=\"noopener noreferrer\">sozluk.gov.tr</a> (Associação da Língua Turca Güncel Türkçe Sözlük)", "Se o seu dispositivo não tiver ligação à Internet ou o TDK não responder, o resultado online não é apresentado; as funcionalidades do dicionário local continuam a funcionar."], "items": ["Dados enviados: apenas a palavra digitada na caixa de pesquisa", "Finalidade: apresentar significado / definição do dicionário", "Nenhuma informação de identidade pessoal é enviada", "Este pedido é feito ao site público do TDK; a aplicação não tem parceria oficial com o TDK"]}, {"title": "5. Permissões", "paragraphs": [], "items": ["<strong>Internet (INTERNET):</strong> Utilizado para consultar o dicionário TDK de palavras não encontradas localmente.", "<strong>Notificações (POST_NOTIFICATIONS):</strong> Opcional. Solicitado para mostrar a notificação «Palavra do dia». Pode ser desativado nas definições do dispositivo.", "<strong>Pesquisa por voz / microfone:</strong> Ao tocar no ícone do microfone, o serviço de reconhecimento de voz do dispositivo (p. ex., Google) pode abrir. Não armazenamos gravações de áudio; apenas o texto reconhecido é colocado na caixa de pesquisa."]}, {"title": "6. Terceiros", "paragraphs": ["A aplicação pode interagir com os seguintes serviços de terceiros:", "Não utilizamos SDK de publicidade, SDK de análise nem ferramentas de rastreamento de utilizadores."], "items": ["<strong>Google Play / Play Store:</strong> Distribuição da aplicação e abertura da página da Play Store através de «Avalie-nos». Este processo é gerido pelo Google.", "<strong>sozluk.gov.tr (TDK):</strong> Consulta de definições de palavras não encontradas localmente. Apenas a palavra pesquisada é transmitida.", "<strong>Serviço de reconhecimento de voz do dispositivo:</strong> Quando o utilizador inicia a pesquisa por voz."]}, {"title": "7. Partilha e venda de dados", "paragraphs": ["Não vendemos dados de utilizadores. Não criamos perfis de utilizador nos nossos servidores. Conforme descrito na Secção 4, apenas a palavra pesquisada pode ser enviada ao site TDK para consulta do dicionário."]}, {"title": "8. Segurança dos dados", "paragraphs": ["Os dados locais permanecem no seu dispositivo. As consultas ao dicionário online são feitas via HTTPS. Nenhuma medida de segurança é absoluta; recomendamos manter o dispositivo atualizado."]}, {"title": "9. Privacidade das crianças", "paragraphs": ["A aplicação é uma aplicação geral de aprendizagem de idiomas / dicionário. Não recolhemos deliberadamente dados pessoais de crianças com menos de 13 anos. Os pais devem supervisionar a utilização da aplicação pelos filhos."]}, {"title": "10. Os seus direitos", "paragraphs": ["Pode eliminar dados locais na aplicação (p. ex., removendo favoritos) ou desinstalando a aplicação. Para questões sobre consultas online, escreva para <a href=\"mailto:hayhak1@gmail.com\">hayhak1@gmail.com</a>."]}, {"title": "11. Alterações a esta política", "paragraphs": ["Esta política pode ser atualizada periodicamente. A versão atual é publicada nesta página. A data de «Última atualização» é revista para alterações significativas."]}, {"title": "12. Contacto", "paragraphs": ["Para política de privacidade e tratamento de dados: <a href=\"mailto:hayhak1@gmail.com\">hayhak1@gmail.com</a>"]}], "footer": "© 2026 Dicionário turco · com.hayhak.turkcesozluk"}, "ru": {"title": "Политика конфиденциальности", "pageTitle": "Политика конфиденциальности — Турецкий словарь", "metaApp": "Приложение", "metaPackage": "имя пакета", "metaDeveloper": "Разработчик", "metaUpdated": "Последнее обновление", "updatedDate": "7 августа 2026 г.", "langLabel": "Язык", "intro": "Настоящая политика конфиденциальности объясняет, как приложение <strong>Турецкий словарь</strong>, доступное в Google Play, обрабатывает пользовательские данные. Загружая или используя приложение, вы соглашаетесь с этой политикой.", "sections": [{"title": "1. Контролёр данных и контакты", "paragraphs": ["Контролёр данных / Разработчик: ThunderCraft<br>Электронная почта: <a href=\"mailto:hayhak1@gmail.com\">hayhak1@gmail.com</a>", "По вопросам конфиденциальности свяжитесь с нами по указанному выше адресу электронной почты."]}, {"title": "2. Собираемые данные", "paragraphs": ["Приложение не требует создания учётной записи, входа или регистрации. Мы сознательно не собираем персональные идентификаторы, такие как имя, электронная почта, номер телефона, точное местоположение или документы, удостоверяющие личность, и не отправляем их на наши серверы. У приложения нет собственной учётной записи пользователя или backend-сервера."]}, {"title": "3. Данные, хранящиеся локально на вашем устройстве", "paragraphs": ["Следующие данные хранятся только на вашем устройстве (локальное хранилище / база данных) и не экспортируются с устройства:", "При удалении приложения эти локальные данные также удаляются с вашего устройства."], "items": ["Избранные слова", "История поиска", "Слова / синонимы, добавленные пользователем", "Статистика в приложении (напр., еженедельная активность, серия)", "Настройки, такие как тема и режим словаря"]}, {"title": "4. Данные, обрабатываемые через Интернет", "paragraphs": ["Приложение может использовать подключение к Интернету. Если слово не найдено в локальном словаре, для получения определения <strong>текст искомого слова</strong> может быть отправлен на <a href=\"https://sozluk.gov.tr\" rel=\"noopener noreferrer\">sozluk.gov.tr</a> (Ассоциация турецкого языка Güncel Türkçe Sözlük)", "Если на устройстве нет подключения к Интернету или TDK не отвечает, онлайн-результат не отображается; функции локального словаря продолжают работать."], "items": ["Отправляемые данные: только слово, введённое в поле поиска", "Цель: показать значение / определение из словаря", "Персональные идентификационные данные не отправляются", "Этот запрос направляется на общедоступный сайт TDK; приложение не является официальным партнёром TDK"]}, {"title": "5. Разрешения", "paragraphs": [], "items": ["<strong>Интернет (INTERNET):</strong> Используется для запросов к словарю TDK по словам, не найденным локально.", "<strong>Уведомления (POST_NOTIFICATIONS):</strong> Необязательно. Запрашивается для показа уведомления «Слово дня». Можно отключить в настройках устройства.", "<strong>Голосовой поиск / микрофон:</strong> При нажатии на значок микрофона может открыться служба распознавания речи устройства (напр., Google). Мы не храним аудиозаписи; в поле поиска помещается только распознанный текст."]}, {"title": "6. Третьи стороны", "paragraphs": ["Приложение может взаимодействовать со следующими сторонними сервисами:", "Мы не используем рекламные SDK, аналитические SDK или инструменты отслеживания пользователей."], "items": ["<strong>Google Play / Play Store:</strong> Распространение приложения и открытие страницы Play Store через «Оцените нас». Этот процесс управляется Google.", "<strong>sozluk.gov.tr (TDK):</strong> Поиск определений для слов, не найденных локально. Передаётся только искомое слово.", "<strong>Служба распознавания речи устройства:</strong> Когда пользователь запускает голосовой поиск."]}, {"title": "7. Передача и продажа данных", "paragraphs": ["Мы не продаём пользовательские данные. Мы не создаём профили пользователей на наших серверах. Как описано в Разделе 4, на сайт TDK может быть отправлено только искомое слово для словарного запроса."]}, {"title": "8. Безопасность данных", "paragraphs": ["Локальные данные остаются на вашем устройстве. Онлайн-запросы к словарю выполняются по HTTPS. Ни одна мера безопасности не является абсолютной; рекомендуем поддерживать устройство в актуальном состоянии."]}, {"title": "9. Конфиденциальность детей", "paragraphs": ["Приложение является общим приложением для изучения языка / словарём. Мы сознательно не собираем персональные данные детей младше 13 лет. Родители должны контролировать использование приложения детьми."]}, {"title": "10. Ваши права", "paragraphs": ["Вы можете удалить локальные данные в приложении (напр., удалив избранное) или удалив приложение. По вопросам онлайн-запросов пишите на <a href=\"mailto:hayhak1@gmail.com\">hayhak1@gmail.com</a>."]}, {"title": "11. Изменения в этой политике", "paragraphs": ["Эта политика может периодически обновляться. Актуальная версия публикуется на этой странице. Дата «Последнее обновление» пересматривается при существенных изменениях."]}, {"title": "12. Контакты", "paragraphs": ["По вопросам политики конфиденциальности и обработки данных: <a href=\"mailto:hayhak1@gmail.com\">hayhak1@gmail.com</a>"]}], "footer": "© 2026 Турецкий словарь · com.hayhak.turkcesozluk"}, "sw": {"title": "Sera ya faragha", "pageTitle": "Sera ya faragha — Kamusi ya Kituruki", "metaApp": "Programu", "metaPackage": "jina la kifurushi", "metaDeveloper": "Msanidi", "metaUpdated": "Imesasishwa mwisho", "updatedDate": "Agosti 7, 2026", "langLabel": "Lugha", "intro": "Sera hii ya faragha inaeleza jinsi programu ya <strong>Kamusi ya Kituruki</strong> inavyopatikana kwenye Google Play inavyoshughulikia data ya mtumiaji. Kwa kupakua au kutumia programu, unakubali sera hii.", "sections": [{"title": "1. Mdhibiti wa data na mawasiliano", "paragraphs": ["Mdhibiti wa data / Msanidi: ThunderCraft<br>Barua pepe: <a href=\"mailto:hayhak1@gmail.com\">hayhak1@gmail.com</a>", "Kwa maswali yanayohusiana na faragha, wasiliana nasi kupitia anwani ya barua pepe hapo juu."]}, {"title": "2. Data inayokusanywa", "paragraphs": ["Programu haihitaji kuunda akaunti, kuingia au kusajili. Hatukusanyi kwa makusudi vitambulisho vya kibinafsi kama jina, barua pepe, nambari ya simu, eneo halisi au hati za utambulisho, wala hatuzitumi kwenye seva zetu. Programu haina akaunti ya mtumiaji au seva ya backend yake mwenyewe."]}, {"title": "3. Data iliyohifadhiwa ndani ya kifaa chako", "paragraphs": ["Data ifuatayo huhifadhiwa tu kwenye kifaa chako (hifadhi ya ndani / hifadhidata) na haihamishwi kutoka kifaa chako:", "Unapoondoa programu, data hii ya ndani pia huondolewa kwenye kifaa chako."], "items": ["Maneno ya vipendwa", "Historia ya utafutaji", "Maneno / visawe vilivyoongezwa na mtumiaji", "Takwimu ndani ya programu (k.m. shughuli ya kila wiki, mfululizo)", "Mipangilio kama mandhari na hali ya kamusi"]}, {"title": "4. Data inayochakatwa kupitia Intaneti", "paragraphs": ["Programu inaweza kutumia muunganisho wa Intaneti. Neno halipopatikana kwenye kamusi ya ndani, <strong>maandishi ya neno</strong> lililotafutwa linaweza kutumwa kwa <a href=\"https://sozluk.gov.tr\" rel=\"noopener noreferrer\">sozluk.gov.tr</a> (Chama cha Lugha ya Kituruki Güncel Türkçe Sözlük)", "Ikiwa kifaa chako hakina muunganisho wa Intaneti au TDK haijibu, matokeo ya mtandaoni hayoonyeshwi; vipengele vya kamusi ya ndani vinaendelea kufanya kazi."], "items": ["Data inayotumwa: neno lililoandikwa kwenye kisanduku cha utafutaji tu", "Lengo: kuonyesha maana / ufafanuzi wa kamusi", "Hakuna taarifa za utambulisho wa kibinafsi zinazotumwa", "Ombi hili linafanywa kwenye tovuti ya umma ya TDK; programu haiko katika ushirikiano rasmi na TDK"]}, {"title": "5. Ruhusa", "paragraphs": [], "items": ["<strong>Intaneti (INTERNET):</strong> Inatumika kuuliza kamusi ya TDK kwa maneno yasiyopatikana ndani.", "<strong>Arifa (POST_NOTIFICATIONS):</strong> Hiari. Inaombwa kuonyesha arifa ya “Neno la siku”. Inaweza kuzimwa kwenye mipangilio ya kifaa.", "<strong>Utafutaji wa sauti / kipaza sauti:</strong> Unapogusa ikoni ya kipaza sauti, huduma ya utambuzi wa sauti ya kifaa (k.m. Google) inaweza kufunguka. Hatuhifadhi rekodi za sauti; maandishi yaliyotambuliwa tu huwekwa kwenye kisanduku cha utafutaji."]}, {"title": "6. Wahusika wengine", "paragraphs": ["Programu inaweza kuingiliana na huduma za wahusika wengine zifuatazo:", "Hatutumii SDK za matangazo, SDK za uchanganuzi au zana za ufuatiliaji wa watumiaji."], "items": ["<strong>Google Play / Play Store:</strong> Usambazaji wa programu na kufungua ukurasa wa Play Store kupitia “Tukadirie”. Mchakato huu unasimamiwa na Google.", "<strong>sozluk.gov.tr (TDK):</strong> Utafutaji wa ufafanuzi kwa maneno yasiyopatikana ndani. Neno lililotafutwa tu ndilo hutumwa.", "<strong>Huduma ya utambuzi wa sauti ya kifaa:</strong> Mtumiaji anapoanzisha utafutaji wa sauti."]}, {"title": "7. Kushiriki na kuuza data", "paragraphs": ["Hatuuzi data ya watumiaji. Hatushi data ya wasifu wa mtumiaji kwenye seva zetu. Kama ilivyoelezwa katika Sehemu ya 4, neno lililotafutwa tu linaweza kutumwa kwenye tovuti ya TDK kwa utafutaji wa kamusi."]}, {"title": "8. Usalama wa data", "paragraphs": ["Data ya ndani hubaki kwenye kifaa chako. Maswali ya kamusi ya mtandaoni hufanywa kupitia HTTPS. Hakuna hatua ya usalama iliyo kamili; tunapendekeza uweke kifaa chako kisasishwe."]}, {"title": "9. Faragha ya watoto", "paragraphs": ["Programu ni programu ya jumla ya kujifunza lugha / kamusi. Hatukusanyi kwa makusudi data ya kibinafsi kutoka kwa watoto chini ya miaka 13. Wazazi wanapaswa kusimamia matumizi ya programu na watoto wao."]}, {"title": "10. Haki zako", "paragraphs": ["Unaweza kufuta data ya ndani kwenye programu (k.m. kwa kuondoa vipendwa) au kwa kuondoa programu. Kwa maswali
